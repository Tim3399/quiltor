[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quiltor"
dynamic = ["version"]
description = "Local-first writing workshop with a private, on-device assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0 OR PolyForm-Small-Business-1.0.0" }
# The server itself (`python3 server.py`) stays standard-library only; this
# is the one dependency of the packaged `quiltor` CLI's `run`/`config` commands.
dependencies = ["typer>=0.12"]

# Only needed for desktop.py (a native-window desktop build, see packaging/) --
# never required for `python3 server.py`, the plain CLI, or Docker.
#
# `desktop` is everything a windowed build always needs. `browser-pdf` is split
# out because Playwright is only used by backend/pdf/system_browser.py, and a
# Mac App Store build cannot use that renderer at all: the sandbox refuses to
# launch an installed Chrome. Keeping it separate is what lets packaging leave
# it out there -- worth doing, since Playwright's driver carries its own `node`
# binary, 128 MB of a 165 MB app, and shipping a general-purpose JavaScript
# interpreter inside a Store bundle is a known review flashpoint.
[project.optional-dependencies]
desktop = ["pywebview>=5.0", "pystray>=0.19", "Pillow>=10"]
browser-pdf = ["playwright>=1.40"]

[project.scripts]
quiltor = "backend.cli:main_entry"
quiltor-desktop = "desktop:main"

[project.urls]
Homepage = "https://github.com/Tim3399/quiltor"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["backend", "mcp"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"desktop.py" = "desktop.py"
"desktop_tray.py" = "desktop_tray.py"
"VERSION" = "VERSION"
"dist" = "dist"
"scripts" = "scripts"
"packaging/icons" = "packaging/icons"

[tool.hatch.build.targets.sdist]
include = ["backend", "mcp", "server.py", "desktop.py", "desktop_tray.py", "VERSION", "scripts", "README.md", "LICENSE"]

[tool.hatch.build.targets.sdist.force-include]
"dist" = "dist"
"packaging/icons" = "packaging/icons"
