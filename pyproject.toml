[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quiltor"
dynamic = ["version"]
description = "Local-first writing workshop with a private, on-device assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0 OR PolyForm-Small-Business-1.0.0" }
# The server itself (`python3 server.py`) stays standard-library only; this
# is the one dependency of the packaged `quiltor` CLI's `run`/`config` commands.
dependencies = ["typer>=0.12"]

# Only needed for hosts/desktop/ (a native-window build, see packaging/) --
# never required for `python3 server.py`, the plain CLI, or Docker.
#
# `desktop` is everything a windowed build always needs. `browser-pdf` is split
# out because Playwright is only used by backend/pdf/system_browser.py, and a
# Mac App Store build cannot use that renderer at all: the sandbox refuses to
# launch an installed Chrome. Keeping it separate is what lets packaging leave
# it out there -- worth doing, since Playwright's driver carries its own `node`
# binary, 128 MB of a 165 MB app, and shipping a general-purpose JavaScript
# interpreter inside a Store bundle is a known review flashpoint.
[project.optional-dependencies]
# pywebview 5.4 is the floor, not 5.0: earlier releases have the
# ALLOW_DOWNLOADS setting but no backend that acts on it, so switching it on
# would be silently useless and every export would stay dead. 5.4 is where
# cocoa.py gained shouldPerformDownload/DownloadDelegate; edgechromium and gtk
# gate on the same flag. See hosts/desktop/app.py::enable_downloads.
desktop = ["pywebview>=5.4", "pystray>=0.19", "Pillow>=10"]

# PDF export by driving an installed Chrome or Edge -- needed on Windows and
# Linux only. macOS prints through WKWebView (backend/pdf/wkwebview.py), so a
# Mac build wants `.[desktop]` alone and is ~128 MB smaller for it: Playwright
# ships its own `node` binary, which would otherwise be most of the bundle.
browser-pdf = ["playwright>=1.40"]

[project.scripts]
quiltor = "hosts.cli.main:main_entry"
quiltor-desktop = "hosts.desktop.app:main"

[project.urls]
Homepage = "https://github.com/Tim3399/quiltor"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["backend", "hosts"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"VERSION" = "VERSION"
"dist" = "dist"
"scripts" = "scripts"
"packaging/icons" = "packaging/icons"

[tool.hatch.build.targets.sdist]
include = ["backend", "hosts", "server.py", "VERSION", "scripts", "README.md", "LICENSE"]

[tool.hatch.build.targets.sdist.force-include]
"dist" = "dist"
"packaging/icons" = "packaging/icons"
