[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quiltor"
dynamic = ["version"]
description = "Local-first writing workshop with a private, on-device assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0 OR PolyForm-Small-Business-1.0.0" }
# The server itself (`python3 server.py`) stays standard-library only; this
# is the one dependency of the packaged `quiltor` CLI's `run`/`config` commands.
dependencies = ["typer>=0.12"]

[project.scripts]
quiltor = "backend.cli:main_entry"

[project.urls]
Homepage = "https://github.com/Tim3399/quiltor"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["backend", "mcp"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"VERSION" = "VERSION"
"dist" = "dist"
"scripts" = "scripts"

[tool.hatch.build.targets.sdist]
include = ["backend", "mcp", "server.py", "VERSION", "scripts", "README.md", "LICENSE"]

[tool.hatch.build.targets.sdist.force-include]
"dist" = "dist"
