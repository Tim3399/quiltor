[build-system]
requires = ["hatchling==1.31.0", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "quiltor"
dynamic = ["version"]
description = "Local-first writing workshop with a private, on-device assistant"
readme = "README.md"
# One minor series across hosts: builds use 3.12.10 (distribution/toolchains.json), while
# the shipped web image inherits 3.12.3 from Ubuntu 24.04. Both use 3.12, so the requirement
# names that series rather than a patch version the two hosts do not share.
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0 OR PolyForm-Small-Business-1.0.0" }

# Core dependencies are shared by every supported host. PyJWT's crypto extra is
# required for fail-closed OIDC ID-token signature verification in hosted and
# desktop backup-login flows.
dependencies = ["typer>=0.12", "PyJWT[crypto]>=2.13,<3", "markdown-it-py==4.2.0"]

# Only needed for the desktop host (a native-window build, see distribution/) --
# never required for the web bootstrap, the plain CLI, or Docker.
#
# `desktop` is everything a windowed build always needs. `browser-pdf` is split
# out because Playwright is only used by infrastructure/pdf/system_browser.py, and a
# Mac App Store build cannot use that renderer at all: the sandbox refuses to
# launch an installed Chrome. Keeping it separate is what lets distribution leave
# it out there -- worth doing, since Playwright's driver carries its own `node`
# binary, 128 MB of a 165 MB app, and shipping a general-purpose JavaScript
# interpreter inside a Store bundle is a known review flashpoint.
[project.optional-dependencies]
# pywebview 5.4 is the floor, not 5.0. Exports do not use pywebview's own
# download handling at all -- on macOS it hangs the app, see
# quiltor/hosts/desktop/bridge/api.py -- they go through a js_api bridge that calls
# window.create_file_dialog(). 5.4 is the oldest release this was verified
# against; earlier ones are simply untested here.
desktop = ["pywebview>=5.4", "pystray>=0.19", "Pillow>=10"]

# PDF export by driving an installed Chrome or Edge -- needed on Windows and
# Linux only. macOS prints through WKWebView (infrastructure/pdf/wkwebview.py), so a
# Mac build wants `.[desktop]` alone and is ~128 MB smaller for it: Playwright
# ships its own `node` binary, which would otherwise be most of the bundle.
browser-pdf = ["playwright==1.61.0"]

[project.scripts]
quiltor = "quiltor.hosts.cli.main:main_entry"
quiltor-desktop = "quiltor.hosts.desktop.app:main"
quiltor-mcp = "quiltor.hosts.mcp.quiltor_server:main"

[project.urls]
Homepage = "https://github.com/Tim3399/quiltor"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build]
# The checked-in document is the source-checkout fallback. Every distributable
# target force-includes its generated profile instead.
exclude = [
  "src/quiltor/infrastructure/platform/quiltor-build-profile.json",
  "src/quiltor/hosts/mcp/README.md",
]

[tool.hatch.build.hooks.custom]
path = "distribution/tooling/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quiltor"]

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "src/quiltor/VERSION"
"dist" = "src/quiltor/resources/web"
"distribution/assets/icons" = "src/quiltor/resources/icons"
"contracts/fixtures/mcp/tools.v1.json" = "src/quiltor/resources/contracts/mcp/tools.v1.json"
"LICENSE" = "src/quiltor/resources/legal/LICENSE"
"THIRD-PARTY-NOTICES.md" = "src/quiltor/resources/legal/THIRD-PARTY-NOTICES.md"

[tool.hatch.build.targets.sdist]
# Keep the source artifact deliberately small and reproducible.  It contains
# exactly what is needed to build the wheel from the sdist; desktop, container,
# service and workflow sources are separate release artifacts.
only-include = [
  "src/quiltor",
  "apps/web/server.py",
  "VERSION",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "THIRD-PARTY-NOTICES.md",
  "distribution/tooling/hatch_build.py",
  "distribution/tooling/profile_contract.py",
  "distribution/profiles/python-package.json",
]

[tool.hatch.build.targets.sdist.force-include]
"dist" = "dist"
"distribution/assets/icons" = "distribution/assets/icons"
"contracts/fixtures/mcp/tools.v1.json" = "src/quiltor/resources/contracts/mcp/tools.v1.json"


# ---------------------------------------------------------------- Formatting

[tool.ruff]
# Target the oldest supported interpreter, not the build interpreter. With "py314",
# Ruff rewrote `except (A, B):` into the unparenthesized PEP 758 form, which requires
# Python 3.14 and would prevent the shipped Python 3.12 runtime from loading the code.
target-version = "py312"
line-length = 100

# Markdown belongs to Prettier. Current Ruff versions can also process Python
# code blocks in Markdown, so explicitly exclude it to keep formatter ownership
# unambiguous.
extend-exclude = [
  "*.md",
  "node_modules",
  "dist",
  "build",
  "coverage",
  ".venv*",
  "venv",
  "target",
  "runtime",
  "models",
  "test-results",
  "playwright-report",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

# ---------------------------------------------------------------- Linting

[tool.ruff.lint]
# An explicit rule set instead of Ruff's moving default, so a ruff bump cannot change
# what the gate means. Pinned to ruff 0.16.4 in distribution/toolchains.json.
#   E4/E7/E9  pycodestyle errors that are not formatting (imports, statements, syntax)
#   F         pyflakes: unused imports/variables, undefined names
#   B         bugbear: likely bugs and sharp edges
#   UP        pyupgrade, relative to target-version py312
#   RUF       Ruff-specific rules
#   PERF      avoidable performance overhead in loops
#   SIM       simplifiable constructs
#   I         import sorting, so imports never churn in diffs
#   S         bandit security checks; tests are exempt below
#   BLE       blind `except Exception`; each remaining site carries a reasoned noqa
select = ["E4", "E7", "E9", "F", "B", "UP", "RUF", "PERF", "SIM", "I", "S", "BLE"]
ignore = [
  # S603/S607: every subprocess call here takes an argument list (never shell=True) and
  # launches a known tool (git, node, powershell, pandoc ...). Flagging each call site
  # as "untrusted input" would only produce noqa noise; shell=True stays caught by S602.
  "S603",
  "S607",
  # S310: every urlopen target is a fixed constant or an operator-configured endpoint
  # (the backup base URL is scheme-checked in infrastructure/backup/remote.py); no
  # request input chooses the URL.
  "S310",
  # UP042: str() and format() of a StrEnum member give its value, of a `(str, Enum)` member
  # "Class.member". Switching would change behaviour, not just spelling.
  "UP042",
  # PERF401: every remaining hit is an append inside nested loops with conditions (AST
  # walks, file scans). A comprehension there is harder to read and the gain is nil.
  "PERF401",
]

# Not selected, deliberately:
#   TRY   style opinions (TRY003 alone is 1000+ hits on ordinary messages) and TRY004
#         would change which exception type callers see.
#   PT    the suites use unittest, not pytest.
#   ANN, D, COM, ...  annotation/docstring/comma style is owned by the formatter and review.

[tool.ruff.lint.per-file-ignores]
# Tests use assert, fixed throwaway credentials, temp paths and subprocesses by design.
# SIM117: mock-heavy tests nest `with patch(...)` blocks on purpose; merging them into one
# 100-column statement makes the setup harder to read. BLE001: tests catch broadly to assert.
"tests/**" = ["S", "SIM117", "BLE001"]
# Request boundary: any exception inside a handler becomes an error response.
"src/quiltor/delivery/http/routes/*.py" = ["BLE001"]
# Entry-point scripts put the source tree on sys.path before they can import from it.
"services/backup-server/server.py" = ["E402"]
"src/quiltor/hosts/mcp/quiltor_server.py" = ["E402"]
"tools/evaluation/assistant/seed_*.py" = ["E402"]

# pyright, pinned in package.json; run it with `npm run lint:pyright`. See
# docs/quality/linting.md for what it checks and why each setting is here.
[tool.pyright]
include = ["src/quiltor", "apps/web", "tools", "distribution/tooling", "tests/python"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# strict where the code is new and small enough to hold to it. src/quiltor/domain and
# application would add ~1,200 findings in strict mode, almost all untyped JSON dicts;
# that is a migration of its own, not part of introducing the gate.
strict = ["tests/python/narrowing.py", "tests/python/module_loader.py"]
# Analyse this checkout's sources rather than the editable install (which points at the
# main checkout from a worktree), and resolve the release tooling the tests put on
# sys.path at runtime.
extraPaths = ["src", "distribution/tooling", "distribution/desktop/pyinstaller"]
# Bare `# type: ignore` is not honoured: a suppression has to be
# `# pyright: ignore[<rule>]` and so names the rule it silences.
enableTypeIgnoreComments = false
