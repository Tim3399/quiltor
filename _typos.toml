# typos configuration -- spelling in code, comments, identifiers and English documentation.
#
#   npm run lint:typos        (part of `npm run check`; see docs/quality/linting.md)
#
# typos checks English. It cannot tell a German word from a misspelled English one, so
# German content is kept out of its way, in four layers, narrowest first:
#   1. [default.extend-ignore-re]: exact strings -- string literals that contain German
#      letters, quoted German phrases, deliberate misspellings, commit hashes.
#   2. [default.extend-words]: code words that are not misspellings (a persisted value, a
#      third-party API name, an acronym). No German vocabulary: a German word allowed
#      everywhere also lets through the English typo it resembles (stil/still, vor/for,
#      startet/started).
#   3. [type.germantest]: German vocabulary, but only in test, story and spec files and the
#      contract fixtures, where German interface text and fixture prose are asserted.
#   4. [files] extend-exclude: files that are German as a whole, or generated.
# Nothing here hides an English file because it has many findings.

[files]
extend-exclude = [
  # The interface itself: German product text (CLAUDE.md, "Language").
  "locales/de/**",

  # Build output. Minified bundles contain the German interface text and every identifier
  # of the sources; the sources are the thing to check.
  "dist/**",

  # Generated from team/roles by team/sync.mjs (the same list as .prettierignore). The
  # sources in team/ are excluded below.
  ".claude/agents/**",
  ".claude/output-styles/**",
  "team/roles/**",

  # The join instructions of the agent team are German and read by the team. The English
  # code in team/ (hooks, sync, bootstrap) is checked.
  "team/TEAM-BEITRETEN.txt",

  # German documents, written for the author or for the German-speaking team.
  "README.md",
  "DESIGN.md",
  "docs/ERSTE-SCHRITTE.md",
  "docs/design/FRONTEND_STYLEGUIDE.md",
  "docs/plans/**",
  "packages/client/src/design/README.md",

  # German manuscripts and fixture prose used as input: an author's material, not code
  # (CLAUDE.md). The two scripts are data tables of German sentences and nothing else.
  "tools/documentation/**/*.md",
  "tools/evaluation/**/*.md",
  "tests/fixtures/**",
  "tools/documentation/readme_fixture.mjs",
  "tools/evaluation/assistant/seed_synthetic_world.py",

  # The browser-inference test page is German interface text for testers, and its prompt
  # files are generated from the German evaluation world.
  "tools/evaluation/browser-inference/index.html",
  "tools/evaluation/browser-inference/prompt.js",
  "tools/evaluation/browser-inference/prompt.json",
]

[default]
extend-ignore-re = [
  # Commit hashes quoted in documents ("13dbe50" reads as "dbe").
  "\\b[0-9a-f]{7,40}\\b",

  # CLAUDE.md names the transliterations it tells the reader to grep for.
  "`ae`/`oe`/`ue`",
  # ... and quotes German phrases and persisted field names that were once German.
  "`elementeVerborgen`",
  "mischt benannte und unbenannte Geometrie",

  # A SQL keyword in the plural: "UPDATEs" is split as UPDAT + Es.
  "\\bUPDATEs\\b",
  # "PNGs" is split as PN + Gs.
  "\\bPNGs\\b",

  # Deliberate misspellings: the grammar and autocomplete tests feed them in on purpose.
  "\\bHelo\\b",
  "suggest\\(\"Trak\"",
  # Unicode character name in a fixture id (CYRILLIC LETTER TJE).
  "cyrillic-tje",

  # A string literal on one line that contains a German letter is German product text: a
  # prompt, a message, an example request. Its words are German, whatever they resemble.
  "\"[^\"\\n]*[äöüÄÖÜß][^\"\\n]*\"",
  "'[^'\\n]*[äöüÄÖÜß][^'\\n]*'",
  "`[^`\\n]*[äöüÄÖÜß][^`\\n]*`",

  # German product text without a German letter, outside the tests. Each phrase is quoted
  # from a message, a prompt, an example request or a German identifier in the sources.
  "\\belementeVerborgen\\b",
  "angeboteneElemente",
  "const elemente =|of elemente\\)|\\[elemente\\]|elemente\\.length",
  "Art / Funktion",
  "vor 0 Sekunden",
  "Ohne Titel",
  "Beziehung \\{edge_id\\} ist",
  "liegt vor dem",
  "Lokaler Modell-Prozess ist",
  "Lokales Modell ist noch nicht installiert oder",
  "Kontext oder nicht",
  "oder lass mich",
  "Ergebnis ist nicht mehr",
  "Antwort ist veraltet",
  "ist als Vorschlag",
  "\\bals (Vorschlag|Figur|Ort|Belege|verstorben)\\b",
  "Ein passender Eintrag",
  "\"alle\"-style",
  "seal vor\"",
  "nach dem Prozess an",
  "Staatssiegel vor: Sie\\b",
  "Durchsuche alle Kapitel",
  "verbundene Elemente",
  "Lio ist der",
  "\\(szene\\|",
  "Anmeldung ist nicht",
  "data-id=\"archiv\"",
  "\\(er\\|sie\\|",
  "Papyrus Autor",
  "KI-Suche",
  "`Ende entfernen`",

  # German phrases whose words are also plausible English typos. Each one is quoted from
  # the interface text, an assertion or a fixture sentence.
  "Anna (packte|brach)\\b",
  "an Bord\\b",
  "für deine Ideen",
  "Mögliche Wege",
  "\\$\\{days\\} Tage",
  "Die Leinwand passt\\b",
  "title\": \"Offen\"",
  "name: \"Relativ\"",
  "das Menue\\b",
  "Mara fand die Karte",
  "Mara legt die Briefe",
  "Corvin habe eine",
  "\\bIch habe\\b",
  "Deshalb habe ich\\b",
  "Verbindungen im Diagramm",
  "\"Orte LOD-Welt\"",
  "LEINWAND_TOLERANZ",
  "Bleibt offen",
  "Handlungszeit offen",
  "noch offen\\?",
  "\\$\\{offen \\?",
  "name: \"Offen\"",
  "deine (Daten|Welt)",
  "Regen fiel",
  "\\d Tage\\b",
  ">Relativ<",
  "Wege einblenden",
  "Legende der",
  "Favorit entfernen",
  "\"Januar\"",

  # The layout audit's German mock world (tests/audit/support/audit-world.ts): fixture ids
  # and fixture prose without a German letter. Narrow on purpose -- the file also holds
  # English route-mocking code, which stays checked.
  "\"(t-|i-)?archiv(ort)?\"",
  "Eine Szene, die noch",
  "Ein Anfang, der nicht",
  "Wer hat sie dort versteckt",
  "habe ich eine neue Figur",

  # The umlaut transliteration table of slug() in tests/audit/support/enumerate.ts:
  # .replace(/ä/g, "ae") ... Only the replacement strings, not "ue" in general.
  '\.replace\(/[äöüÄÖÜß]/g, "(ae|oe|ue|ss|Ae|Oe|Ue)"\)',

  # The regular expressions that recognise German and English commands in a prompt. They
  # list stems, cut off on purpose ("analysier\\w*", "konsisten\\w*", "[Ll]ege").
  "analysier\\\\w\\*",
  "onsisten\\\\w\\*",
  "\\[Ll\\]ege",
  "\\[Cc\\]reate",
]

[default.extend-words]
# --- code, not prose -------------------------------------------------------------------
# Persisted value: the element type "objekt" is an enum member of the story-world contract
# (contracts/**/*.schema.json) and a column value in the SQLite schema. Renaming it needs a
# migration of every stored document and a new contract version.
objekt = "objekt"
# PyInstaller's own keyword in quiltor.spec and its API (`datas`, `binaries`).
datas = "datas"
# Level of detail, the name of the zoom stages in the canvas code and its tests.
lod = "lod"
# Open Packaging Format, the EPUB package document.
opf = "opf"

# German vocabulary, allowed only where German interface text and fixture prose are asserted:
# test, story and spec files and the contract fixtures. typos gives every file exactly one
# type, and a custom type wins over the built-in ones (py, ts, json) only through file-name
# globs; a path glob such as "tests/**" never matches, so these are file-name patterns.
[type.germantest]
extend-glob = [
  "test_*.py",
  "*.test.ts",
  "*.test.tsx",
  "*.spec.ts",
  "*.story.tsx",
  "*.testSupport.tsx",
  "*.v[0-9].json",
]

# The agent-team tooling in team/ has English code but German comments, messages and test
# titles, read by the team. Only the German words found there are allowed, and only in these
# files (file-name globs, see above; the names occur nowhere else). Everything else in team/
# -- identifiers, English comments, the JSON files -- is checked like any other file.
[type.germanteam]
extend-glob = [
  "sync.mjs",
  "bootstrap.mjs",
  "lib.mjs",
  "policy.mjs",
  "registry-title.mjs",
  "selftest.mjs",
  "session-start.mjs",
  "start-team.cmd",
]

[type.germanteam.extend-words]
ist = "ist"
ein = "ein"
oder = "oder"
als = "als"
alle = "alle"
sie = "sie"
vor = "vor"
modell = "modell"
