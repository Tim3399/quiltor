# zizmor configuration. zizmor finds this file on its own (.github/zizmor.yml).
# See docs/quality/linting.md for what the audit covers and how to run it.

rules:
  template-injection:
    ignore:
      # Release Build, "Create the manifest from required and explicitly enabled artifacts".
      # tests/python/test_release.py asserts these `${{ }}` expressions literally (the web
      # and backup image references, and the wheel and sdist names), so the step cannot move
      # them into `env:` without rewriting that contract. Every value is a job output this
      # workflow produced itself: the version passed profile_contract.py check-release and
      # the monotonic check, the image references are `<repository>@sha256:<64 hex>` bound
      # by a regex in their own jobs. The workflow runs only on push to main and dispatch.
      # Line numbers are deliberate: an edit that moves the step makes zizmor fail again,
      # and the ignore has to be re-justified.
      # Re-justified for T-35: the step is unchanged; release-plan, tests, release-complete
      # and the re-checks above it moved it down by 127 lines.
      # Re-justified for T-35-fix: still unchanged; the gate's rust-toolchain step grew
      # by its components line and a comment, moving it down by 2.
      - release.yml:623
      - release.yml:625
      - release.yml:626
      - release.yml:627
      - release.yml:628
      - release.yml:631
      - release.yml:634
  self-repository:
    ignore:
      # Release Build calls test.yml as ./.github/workflows/test.yml (T-35). The `$/` form zizmor
      # suggests is unknown to the pinned actionlint (distribution/toolchains.json), and
      # workflow_contract.py (C-4) holds the call to exactly this path.
      - release.yml:72
      # Test calls llama-conformance.yml the same way, on request only (T-179, D-167); the
      # same reason applies, and workflow_contract.py (OPTIONAL_JOBS) holds the job to exactly
      # this path.
      - test.yml:999
