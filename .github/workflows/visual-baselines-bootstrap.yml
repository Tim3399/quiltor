name: Visual-Baselines erzeugen

# Fuellt fehlende Pixel-Baselines und schiebt sie in den Branch zurueck.
#
# Ausschliesslich mit --update-snapshots=missing: der Lauf schreibt nur Bilder, die es fuer
# diese Plattform noch nicht gibt, und ruehrt vorhandene Referenzen nicht an. Damit kann er
# keine Regression stillschweigend zur neuen Wahrheit machen -- ein geaendertes Bild bleibt
# ein Fehlschlag, den ein Mensch ansehen muss.
#
# Der Lauf startet bei jedem Push, prueft aber zuerst, ob ueberhaupt etwas fehlt, und bricht
# sonst nach einem einzigen kleinen Job ab. Zu tun ist es einmal pro Plattform -- und wieder,
# wenn die Bilder einer Plattform bewusst geloescht wurden, weil sich das Design geaendert hat.
#
# Ein Push mit GITHUB_TOKEN loest keinen neuen Workflow aus. Das schliesst eine Schleife aus,
# heisst aber auch: nach dem Nachtragen der Bilder muss der Testlauf einmal neu gestartet
# werden, damit er sie vergleicht. Auf einem geschuetzten Branch schlaegt der Push fehl; dort
# gehoeren die Bilder ueber einen Pull Request hinein.

on:
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, in den die Bilder geschrieben werden"
        required: false
        default: ""

permissions:
  contents: read

env:
  ZIELBRANCH: ${{ inputs.branch || github.ref_name }}

jobs:
  # Ohne diesen Vorlauf zahlte jeder Push drei Runner, nur um festzustellen, dass alles da ist.
  luecke:
    runs-on: ubuntu-24.04
    outputs:
      fehlt: ${{ steps.pruefen.outputs.fehlt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.ZIELBRANCH }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Fehlt einer Plattform ihr Satz?
        id: pruefen
        shell: bash
        run: |
          if node tools/quality/check_visual_baseline_reach.mjs; then
            echo "fehlt=nein" >> "$GITHUB_OUTPUT"
          else
            echo "fehlt=ja" >> "$GITHUB_OUTPUT"
          fi

  bootstrap:
    needs: luecke
    if: needs.luecke.outputs.fehlt == 'ja'
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      # Nacheinander: alle drei Jobs schreiben in denselben Branch, und ein paralleler
      # Push waere ein Rennen um denselben Ref.
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.ZIELBRANCH }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fehlende Baselines erzeugen
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          QUILTOR_BASELINE_BOOTSTRAP: "1"
        run: |
          npx vite --port 4173 --strictPort --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          # Playwright laesst einen Lauf fehlschlagen, wenn es ein fehlendes Bild schreibt --
          # richtig fuer einen normalen Lauf, hier aber der Erfolgsfall. Ob wirklich etwas
          # entstanden ist, entscheidet der naechste Schritt an den Dateien.
          npx playwright test tests/e2e/visual-baseline.spec.ts \
            --update-snapshots=missing --reporter=line || true
      - name: Neue Bilder einchecken
        shell: bash
        run: |
          snapshots=tests/e2e/visual-baseline.spec.ts-snapshots
          if [ -z "$(git status --porcelain -- "$snapshots")" ]; then
            echo "Fuer ${{ matrix.os }} war bereits ein vollstaendiger Satz vorhanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$snapshots"
          git commit -m "test(e2e): Baselines für ${{ matrix.os }} erzeugt"
          # Zwischen Lauf und Push kann ein anderer Matrix-Job geschrieben haben.
          git pull --rebase origin "$ZIELBRANCH"
          git push origin "HEAD:$ZIELBRANCH"
      - name: Diagnose hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines-bootstrap-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/vite.log
