name: Visual-Baselines erzeugen

# Fills in missing pixel baselines and pushes them back to the branch.
#
# Only ever with --update-snapshots=missing: the run writes images that do not exist for this
# platform yet and leaves existing references alone. That way it cannot quietly promote a
# regression to the new truth -- a changed image stays a failure a person has to look at.
#
# The run starts on every push but first checks whether anything is missing at all, and
# otherwise stops after a single small job. There is work to do once per platform -- and
# again when a platform's images were deliberately deleted because the design changed.
#
# A push with GITHUB_TOKEN triggers no new workflow. That rules out a loop, but it also
# means the test run has to be restarted once after the images land, so that it compares
# them. On a protected branch the push fails; there the images belong in a pull request.

on:
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, in den die Bilder geschrieben werden"
        required: false
        default: ""

permissions:
  contents: read

env:
  ZIELBRANCH: ${{ inputs.branch || github.ref_name }}

jobs:
  # Without this precheck every push would pay three runners just to learn nothing is missing.
  luecke:
    runs-on: ubuntu-24.04
    outputs:
      fehlt: ${{ steps.pruefen.outputs.fehlt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.ZIELBRANCH }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"
      - name: Fehlt einer Plattform ihr Satz?
        id: pruefen
        shell: bash
        run: |
          if node tools/quality/check_visual_baseline_reach.mjs; then
            echo "fehlt=nein" >> "$GITHUB_OUTPUT"
          else
            echo "fehlt=ja" >> "$GITHUB_OUTPUT"
          fi

  bootstrap:
    needs: luecke
    if: needs.luecke.outputs.fehlt == 'ja'
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      # One after another: all three jobs write to the same branch, and pushing in parallel
      # would be a race for the same ref.
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.ZIELBRANCH }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fehlende Baselines erzeugen
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          QUILTOR_BASELINE_BOOTSTRAP: "1"
        run: |
          npx vite --port 4173 --strictPort --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          # Playwright fails a run when it writes a missing image -- right for a normal run,
          # but the success case here. Whether anything was actually produced is decided by
          # the next step, from the files.
          npx playwright test tests/e2e/visual-baseline.spec.ts \
            --update-snapshots=missing --reporter=line || true
      - name: Neue Bilder einchecken
        shell: bash
        run: |
          snapshots=tests/e2e/visual-baseline.spec.ts-snapshots
          if [ -z "$(git status --porcelain -- "$snapshots")" ]; then
            echo "Fuer ${{ matrix.os }} war bereits ein vollstaendiger Satz vorhanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$snapshots"
          git commit -m "test(e2e): Baselines für ${{ matrix.os }} erzeugt"
          # Between the run and the push another matrix job may have written.
          git pull --rebase origin "$ZIELBRANCH"
          git push origin "HEAD:$ZIELBRANCH"
      - name: Diagnose hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-baselines-bootstrap-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/vite.log
