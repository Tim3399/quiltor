name: Visual-Baselines erzeugen

# Fuellt fehlende Pixel-Baselines und schiebt sie in den Branch zurueck.
#
# Nur von Hand startbar, und ausschliesslich mit --update-snapshots=missing: der Lauf schreibt
# nur Bilder, die es fuer diese Plattform noch nicht gibt, und ruehrt vorhandene Referenzen
# nicht an. Damit kann er keine Regression stillschweigend zur neuen Wahrheit machen -- ein
# geaendertes Bild bleibt ein Fehlschlag, den ein Mensch ansehen muss.
#
# Zu tun ist das einmal pro Plattform, und wieder, wenn die Baselines fuer eine Plattform
# bewusst geloescht wurden, weil sich das Design geaendert hat.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, in den die Bilder geschrieben werden"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ${{ matrix.os }}
    strategy:
      # Nacheinander: alle drei Jobs schreiben in denselben Branch, und ein paralleler
      # Push waere ein Rennen um denselben Ref.
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fehlende Baselines erzeugen
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          QUILTOR_BASELINE_BOOTSTRAP: "1"
        run: |
          npx vite --port 4173 --strictPort --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          # Playwright laesst einen Lauf fehlschlagen, wenn es ein fehlendes Bild schreibt --
          # richtig fuer einen normalen Lauf, hier aber der Erfolgsfall. Ob wirklich etwas
          # entstanden ist, entscheidet der naechste Schritt an den Dateien.
          npx playwright test tests/e2e/visual-baseline.spec.ts \
            --update-snapshots=missing --reporter=line || true
      - name: Neue Bilder einchecken
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          snapshots=tests/e2e/visual-baseline.spec.ts-snapshots
          if [ -z "$(git status --porcelain -- "$snapshots")" ]; then
            echo "Fuer ${{ matrix.os }} war bereits ein vollstaendiger Satz vorhanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$snapshots"
          git commit -m "test(e2e): Baselines für ${{ matrix.os }} erzeugt"
          # Zwischen Lauf und Push kann ein anderer Matrix-Job geschrieben haben.
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Diagnose hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines-bootstrap-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/vite.log
