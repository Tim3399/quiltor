name: Writing Data

# Builds the prebuilt writing-assistance dictionary from the dewiktionary extract and the
# OpenThesaurus export (tools/writing-data/build.py). Started by hand only. Without the
# publish switch the run ends with a workflow artifact; with it, the same files become an
# immutable data release `writing-data-<YYYY.MM.DD>` that is never marked latest, so it
# cannot be mistaken for an app release (distribution/tooling/workflow_contract.py).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create the writing-data release and upload the database and its sources
        required: true
        type: boolean
        default: false

concurrency:
  group: writing-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - id: version
        name: Data version from the UTC date
        run: echo "value=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      - name: Fetch the upstream sources and write the lock
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python tools/writing-data/build.py fetch \
            --sources work/sources --lock work/sources.lock.json \
            --archive-base "https://github.com/$REPOSITORY/releases/download/writing-data-$VERSION"
      - name: Build the dictionary from the locked sources
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python tools/writing-data/build.py build \
            --sources work/sources --lock work/sources.lock.json \
            --output work/writing.sqlite3 --version "$VERSION"
      - name: Pack the database with its manifest and license
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python tools/writing-data/build.py pack \
            --database work/writing.sqlite3 --lock work/sources.lock.json \
            --out work/release --version "$VERSION" --tool-commit "$GITHUB_SHA"
      - name: Add the archived sources and the lock
        run: |
          set -euo pipefail
          for source in dewiktionary openthesaurus; do
            file="$(jq -r ".sources.$source.file" work/sources.lock.json)"
            name="$(jq -r ".sources.$source.archive_name" work/sources.lock.json)"
            cp "work/sources/$file" "work/release/$name"
          done
          cp work/sources.lock.json work/release/sources.lock.json
          ls -l work/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: writing-data
          path: work/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: writing-data
          path: release
      - name: Create the writing-data release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="writing-data-$VERSION"
          [[ "$TAG" =~ ^writing-data-[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] \
            || { echo "::error::unexpected data release tag $TAG"; exit 1; }
          gh release create "$TAG" release/* \
            --repo "$REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Writing data $VERSION" \
            --notes-file release/LICENSE-DATA.txt \
            --latest=false
