name: Release

on:
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

# Build everything first, publish once. Every artifact job depends on
# version-check alone and hands its output to actions/upload-artifact;
# tag-and-release runs last, needs all of them, and only then creates the tag,
# the Release and the :latest image tag.
#
# The order matters more than it looks. Publishing first and building after --
# which is what this was -- means the first failure of a build leaves a tag and
# a Release already pushed, and re-running the workflow is no help: version-check
# finds the tag, sets should_release=false, and skips every job while reporting
# green. Recovery is deleting a tag by hand or knowing to use "Re-run failed
# jobs" in the Actions UI. Building first costs nothing (the jobs run in
# parallel either way) and makes a failed release a no-op you fix and push again.
jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      should_release: ${{ steps.compute.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version and check for drift
        id: compute
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::VERSION ($VERSION) and package.json's \"version\" ($PKG_VERSION) are out of sync. Update both before merging."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists — nothing to do."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  docker:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.image.outputs.repo }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute lowercase image repository
        id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The version tag is pushed here; the moving tag is not. docker/build-push-action
      # pushes as it builds, so it is the one artifact that cannot wait for the other
      # jobs -- but ":latest" is the only tag anybody pulls by accident, and moving it
      # is a cheap registry-side operation that tag-and-release does at the end.
      #
      # The alternative -- push: false, export the image with
      # `outputs: type=docker,dest=image.tar`, and load-and-push it from
      # tag-and-release -- was rejected: it pumps a few hundred MB through the
      # artifact store on every release and throws away the layer deduplication the
      # registry already does, to avoid publishing an immutable :X.Y.Z tag that
      # nothing points at until :latest moves and that a re-run overwrites byte for
      # byte anyway.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            QUILTOR_VERSION=${{ needs.version-check.outputs.version }}
          tags: ${{ steps.image.outputs.repo }}:${{ needs.version-check.outputs.version }}

  # The backup endpoint's image, published separately from the app's: it has
  # its own Dockerfile (deploy/backup-server) and is deployed independently
  # (self-hosters may run only this, on a different host than the app -- see
  # docker-compose.yml's `with-backup` profile). Depends on version-check
  # alone, like `docker` above, so a failure here cannot block the app image.
  docker-backup:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.image.outputs.repo }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute lowercase image repository
        id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backup" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./deploy/backup-server
          push: true
          tags: ${{ steps.image.outputs.repo }}:${{ needs.version-check.outputs.version }}

  wheel:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade build
      - run: python -m build --outdir pkg-dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          if-no-files-found: error
          path: |
            pkg-dist/*.whl
            pkg-dist/*.tar.gz

  # The two artifacts users actually install. Both run packaging/build_macos.sh
  # and packaging/build_windows.ps1 unchanged -- the same commands documented in
  # packaging/README.md and run by hand on a laptop -- so there is no second,
  # CI-only build path that can drift from the one a developer can reproduce.
  macos-app:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    # Must be an Apple-silicon image: packaging/quiltor.spec builds arm64 only
    # (universal2 would need universal2 wheels for Pillow, pywebview and
    # pystray). Asserted below rather than trusted, since which hardware
    # macos-latest points at is GitHub's decision, not ours.
    runs-on: macos-latest
    env:
      # packaging/bundle.py turns this into CFBundleVersion, which Apple
      # requires to increase with every upload and which is independent of
      # VERSION. Unset it is "0" for every build forever, which App Store
      # Connect rejects on the second submission. run_number only ever goes up.
      QUILTOR_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the floor in pyproject.toml

      # Exactly packaging/README.md's "One-time setup", minus the venv: the
      # runner is already a throwaway environment.
      - name: Desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          python -m pip install pyinstaller

      # One step, two outcomes, no second build path. build_macos.sh already
      # signs only when QUILTOR_SIGN_IDENTITY is set and notarizes only when
      # QUILTOR_NOTARY_PROFILE is set too, so all this does is put those in the
      # environment when the secrets exist -- and nothing at all when they do
      # not, which is today. Creating the secrets (see packaging/README.md,
      # "Signing in CI") is therefore the only step between an unsigned release
      # and a notarized one: no YAML change, and no unsigned path that quietly
      # rots because nobody exercises it.
      - name: Apple code signing (no-op without the secrets)
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "::notice::No APPLE_CERTIFICATE_P12 secret -- building unsigned."
            echo "::notice::Gatekeeper will warn on the .dmg; see packaging/README.md."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/quiltor-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # A keychain re-locks after five minutes idle by default, and
          # notarization waits on Apple for rather longer than that.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERTIFICATE"
          # codesign is a different process from the one that imported the key,
          # so without a partition list macOS asks permission per signature --
          # and on a runner with no window server that is a hang, not a dialog.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Prepended, not substituted: replacing the search list would drop the
          # system roots and with them the chain the certificate validates against.
          # The word splitting is the point -- -s takes one argument per keychain.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Read back rather than configured as a sixth secret -- a freshly
          # created keychain holds exactly the certificate just imported, so the
          # identity string cannot be stale or mistyped.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No *valid* Developer ID Application identity in the imported"
            echo "::error::certificate. If the listing below shows one as CSSMERR_TP_NOT_TRUSTED,"
            echo "::error::the .p12 is missing its issuer chain -- re-export it from Keychain"
            echo "::error::Access with the certificate and its private key selected together."
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "QUILTOR_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ]; then
            xcrun notarytool store-credentials "quiltor-notary" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
            echo "QUILTOR_NOTARY_PROFILE=quiltor-notary" >> "$GITHUB_ENV"
            echo "QUILTOR_NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          else
            echo "::warning::Signed but not notarized (APPLE_ID / APPLE_TEAM_ID /"
            echo "::warning::APPLE_APP_PASSWORD missing). Gatekeeper still warns on first launch."
          fi

      # create-dmg is deliberately not installed. It lays the .dmg window out
      # via AppleScript, which wants a logged-in Finder; build_macos.sh falls
      # back to hdiutil, which needs nothing and produces the same installable
      # disk image with default icon placement.
      - name: Build the .dmg
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64" \
            || { echo "::error::This runner is $(uname -m); quiltor.spec builds arm64 only."; exit 1; }
          ./packaging/build_macos.sh
          DMG="packaging/dist/Quiltor-${{ needs.version-check.outputs.version }}.dmg"
          test -f "$DMG" || { echo "::error::$DMG was not produced."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          if-no-files-found: error
          path: packaging/dist/Quiltor-${{ needs.version-check.outputs.version }}.dmg

      # The keychain lives in RUNNER_TEMP and dies with the runner anyway, but
      # deleting it explicitly keeps a private key off disk for whatever gets
      # added to this job later -- and runs even when the build failed.
      - name: Remove the signing keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/quiltor-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi

  windows-app:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      QUILTOR_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          python -m pip install pyinstaller

      # ISCC.exe is what turns the onedir build into Quiltor-Setup-<version>.exe.
      # Chocolatey puts it at the default location build_windows.ps1 already
      # falls back to, so the script needs no CI-specific path.
      - name: Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1

      # build_windows.ps1 skips the installer step when Inno Setup is absent and
      # still exits 0, so the artifact's existence is checked rather than assumed.
      - name: Check the installer exists
        shell: bash
        run: |
          set -euo pipefail
          SETUP="packaging/dist/Quiltor-Setup-${{ needs.version-check.outputs.version }}.exe"
          test -f "$SETUP" || { echo "::error::$SETUP was not produced -- see the build step's log."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: packaging/dist/Quiltor-Setup-${{ needs.version-check.outputs.version }}.exe

  # Last, and only if every build above succeeded. Until this job runs, a
  # release that fails has left nothing behind to clean up: no tag, no Release,
  # and a :latest still pointing at the previous version.
  tag-and-release:
    needs: [version-check, docker, docker-backup, wheel, macos-app, windows-app]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Named, not "everything". Not every artifact of this run is a release
      # asset: docker/build-push-action@v6 uploads a build record of its own
      # (`<owner>~<repo>~<id>.dockerbuild`), and downloading all of them both
      # failed outright and would have attached that record to the public
      # Release -- the create step globs release-assets/*, so whatever lands
      # here ships. This is the three artifacts the build jobs upload on
      # purpose; the check below is what notices when one of them is missing,
      # since a glob over fewer files is not an error by itself.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "{python-package,macos-dmg,windows-installer}"
          merge-multiple: true

      - name: Create and push tag
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"

      # Created with its assets in one call rather than a create followed by
      # uploads: a Release that exists but is missing the installer is the
      # version of this that looks finished and is not.
      - name: Create GitHub Release with every artifact attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-check.outputs.version }}"
          ls -l release-assets
          # Every asset named before anything is published. The glob below would
          # happily create a Release out of whatever did arrive, and a Release
          # missing the installer is precisely the failure this workflow is
          # ordered to avoid -- it looks finished.
          for asset in "Quiltor-$VERSION.dmg" "Quiltor-Setup-$VERSION.exe"; do
            test -f "release-assets/$asset" || { echo "missing asset: $asset" >&2; exit 1; }
          done
          ls release-assets/*.whl >/dev/null || { echo "missing asset: the wheel" >&2; exit 1; }
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes \
            release-assets/*

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Retagging a manifest that is already in the registry -- no rebuild, no
      # pull, no push of any layer. This is the moment :latest starts pointing
      # at the new version, and it is deliberately the last thing that happens.
      - name: Move the :latest image tag
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-check.outputs.version }}"
          for REPO in "${{ needs.docker.outputs.repo }}" "${{ needs.docker-backup.outputs.repo }}"; do
            docker buildx imagetools create -t "$REPO:latest" "$REPO:$VERSION"
          done
