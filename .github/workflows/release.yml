name: Release Build

# The single entry point for every push to main. It always calls test.yml at the same commit
# with full_matrix: true; its release jobs run only when release-plan finds a changed VERSION,
# or on a manual dispatch. Every job that writes, pushes, reads a secret or creates the
# manifest needs both the called full test matrix and the release gate directly, and runs only
# on the verdict full-success (workflow_contract.py, C-17). A dispatch with dry_run rehearses
# all of it on any branch, but pushes no image, signs nothing and creates no manifest.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse on any branch: run every gate, push no image, create no manifest"
        type: boolean
        default: false

# No workflow-level concurrency: a group shared by main pushes would let a newer run replace an
# older pending one, and that run's tests with it.

permissions:
  contents: read

jobs:
  release-plan:
    name: Decide whether this run releases
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        name: Decide release and dry run
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push to main: the question the old paths filter asked, without its limits.
          # Unknown history (a new ref, a force push, an unreachable before) counts as a release
          # candidate; version-check then refuses an existing tag. Doubt never skips tests,
          # because tests do not depend on this job.
          if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]] \
            || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- VERSION; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # The full matrix, called at this exact commit. Not gated on release-plan or release-context:
  # every push to main gets its tests, whatever those jobs decide. test.yml reads no secret.
  tests:
    name: Full test matrix
    uses: ./.github/workflows/test.yml
    with:
      full_matrix: true
    permissions:
      contents: read

  release-context:
    name: Require the exact revision
    needs: release-plan
    if: needs.release-plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse release work outside main
        env:
          DRY_RUN: ${{ needs.release-plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$DRY_RUN" = true ] \
            || { echo "::error::Release Build must run on refs/heads/main, not $GITHUB_REF"; exit 1; }
      # Keeps the checkout token: the next step fetches the branch to compare heads. This job
      # uploads no artifact, so the persisted credential cannot leave the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          fetch-depth: 0
      # On main this is the current main head; a dry run compares with its own branch head.
      - name: Require the current head of the run's branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          HEAD_SHA="$(git rev-parse "refs/remotes/origin/$GITHUB_REF_NAME")"
          [ "$GITHUB_SHA" = "$HEAD_SHA" ] \
            || { echo "::error::Release revision $GITHUB_SHA is not current $GITHUB_REF_NAME $HEAD_SHA"; exit 1; }

  # The release-specific part of the portable gate. It runs beside tests (R5) and skips exactly
  # the steps the called full matrix runs at this commit. It writes nothing: no write
  # permission, no login, no push.
  release-gate:
    name: Portable release gate
    needs: [release-plan, release-context]
    if: needs.release-plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      # No rustfmt or clippy: the portable-core job of the called matrix runs both.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
      - run: npm ci
      - name: Install the browser and declared Python dependencies
        run: |
          python -m pip install --quiet "build==1.5.0" "editables==0.5" "hatchling==1.31.0" "ruff==0.16.4"
          python -m pip install --quiet --no-build-isolation -e .
          bash tools/dev/playwright-linux.sh
      - name: Run the release-specific gate; the called full matrix covers the rest
        run: python distribution/tooling/release_preflight.py --ci-release-scope

  version-check:
    needs: [release-plan, release-context]
    if: needs.release-plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      macos_direct: ${{ steps.targets.outputs.macos_direct }}
      windows_direct: ${{ steps.targets.outputs.windows_direct }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - id: targets
        name: Detect explicitly enabled native release targets
        run: python distribution/tooling/release_manifest.py targets >> "$GITHUB_OUTPUT"
      - id: version
        name: Validate profiles and release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python distribution/tooling/profile_contract.py check-release
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python distribution/tooling/previous_release.py \
            --check-monotonic --current-version "$VERSION"
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null \
            && { echo "::error::v$VERSION already exists"; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  # Write job (C-17): writes packages and pushes the hand-off tag to the registry.
  web-image:
    needs: [release-plan, release-context, version-check, release-gate, tests]
    if: >-
      needs.release-plan.outputs.release == 'true'
      && needs.tests.outputs.verdict == 'full-success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.immutable.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # A dry run builds without a login, so even a stray push would fail.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: needs.release-plan.outputs.dry_run == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        run: |
          set -euo pipefail
          WEB_RUNTIME_BASE_IMAGE="$(jq -er '.webRuntime.reference' distribution/containers/base-images.json)"
          NODE_BASE_IMAGE="$(jq -er '.nodeBuild.reference' distribution/containers/base-images.json)"
          [[ "$WEB_RUNTIME_BASE_IMAGE" =~ ^ubuntu:24\.04@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::the committed Ubuntu 24.04 web runtime base must be sha256-pinned"; exit 1; }
          [[ "$NODE_BASE_IMAGE" =~ ^node:22\.23\.2-bookworm-slim@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::the committed Node 22.23.2 base image must be sha256-pinned"; exit 1; }
          REPOSITORY="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          BUILD_TAG="$REPOSITORY:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          {
            echo "repository=$REPOSITORY"
            echo "tag=$BUILD_TAG"
            echo "runtime_base_image=$WEB_RUNTIME_BASE_IMAGE"
            echo "node_base_image=$NODE_BASE_IMAGE"
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ needs.release-plan.outputs.dry_run == 'false' }}
          build-args: |
            QUILTOR_VERSION=${{ needs.version-check.outputs.version }}
            QUILTOR_REVISION=${{ github.sha }}
            WEB_RUNTIME_BASE_IMAGE=${{ steps.image.outputs.runtime_base_image }}
            NODE_BASE_IMAGE=${{ steps.image.outputs.node_base_image }}
          tags: ${{ steps.image.outputs.tag }}
          provenance: mode=max
          sbom: true
      - id: immutable
        name: Bind the app image to the pushed manifest digest
        if: needs.release-plan.outputs.dry_run == 'false'
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::build did not return an immutable OCI digest"; exit 1; }
          echo "value=$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Enforce the compressed web runtime-image budget
        if: needs.release-plan.outputs.dry_run == 'false'
        env:
          IMAGE: ${{ steps.immutable.outputs.value }}
        run: >-
          python distribution/tooling/oci_image_size.py check "$IMAGE" --budget web

  # Write job (C-17): writes packages and pushes the hand-off tag, as web-image.
  backup-image:
    needs: [release-plan, release-context, version-check, release-gate, tests]
    if: >-
      needs.release-plan.outputs.release == 'true'
      && needs.tests.outputs.verdict == 'full-success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.immutable.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - name: Verify the locked backup base and payload before Docker runs
        run: python distribution/tooling/container_contract.py check
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: needs.release-plan.outputs.dry_run == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        run: |
          set -euo pipefail
          REPOSITORY="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backup"
          BUILD_TAG="$REPOSITORY:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/backup-server/Dockerfile
          push: ${{ needs.release-plan.outputs.dry_run == 'false' }}
          build-args: |
            QUILTOR_VERSION=${{ needs.version-check.outputs.version }}
            QUILTOR_REVISION=${{ github.sha }}
          tags: ${{ steps.image.outputs.tag }}
          provenance: mode=max
          sbom: true
      - id: immutable
        name: Bind the backup image to the pushed manifest digest
        if: needs.release-plan.outputs.dry_run == 'false'
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::build did not return an immutable OCI digest"; exit 1; }
          echo "value=$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

  # Uploads a run artifact only: no write permission, no push. Same edges as the write jobs.
  python-package:
    needs: [release-plan, release-context, version-check, release-gate, tests]
    if: >-
      needs.release-plan.outputs.release == 'true'
      && needs.tests.outputs.verdict == 'full-success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - run: python -m pip install "build==1.5.0" "editables==0.5" "hatchling==1.31.0"
      - name: Materialize the Python package runtime contract
        run: >-
          python distribution/tooling/profile_contract.py materialize python-package
          --output distribution/.build/python-package/quiltor-build-profile.json
      - run: python -m build --no-isolation --outdir pkg-dist
      - name: Verify packaged runtime contracts
        run: python distribution/tooling/artifact_profile.py pkg-dist --profile python-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package
          if-no-files-found: error
          path: |
            pkg-dist/*.whl
            pkg-dist/*.tar.gz

  # Signing job (C-17, C-19): reads the Apple signing secrets, so never in a dry run.
  macos-direct:
    needs: [release-plan, release-context, version-check, release-gate, tests]
    if: >-
      needs.release-plan.outputs.release == 'true'
      && needs.tests.outputs.verdict == 'full-success'
      && needs.release-plan.outputs.dry_run == 'false'
      && needs.version-check.outputs.macos_direct == 'true'
    runs-on: macos-15
    env:
      QUILTOR_BUILD_NUMBER: ${{ github.run_number }}
      QUILTOR_REQUIRE_SIGNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          package-manager-cache: false # an artifact job restores no cache
      - run: npm ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - name: Install the pinned native packaging toolchain
        run: |
          python distribution/tooling/dependency_lock_contract.py check
          python -m pip install --require-hashes \
            --requirement distribution/python-build-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation \
            --requirement distribution/desktop/macos/direct/requirements.lock
      - name: Require and configure Developer ID signing and notarization
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in CERTIFICATE_P12 CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [ -n "${!secret:-}" ] || { echo "::error::$secret is required for a release build"; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/quiltor-signing.keychain-db"
          PASSWORD="$(uuidgen)"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          # Unquoted on purpose: each existing keychain must arrive as its own argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          [ -n "$IDENTITY" ] || { echo "::error::no valid Developer ID identity"; exit 1; }
          echo "QUILTOR_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials quiltor-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
          echo "QUILTOR_NOTARY_PROFILE=quiltor-notary" >> "$GITHUB_ENV"
          echo "QUILTOR_NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - run: bash distribution/desktop/macos/direct/build.sh
      - name: Verify and attest the signed notarized DMG
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          ARTIFACT="distribution/artifacts/macos-direct/Quiltor-$RELEASE_VERSION.dmg"
          codesign --verify --strict --verbose=2 "$ARTIFACT"
          xcrun stapler validate "$ARTIFACT"
          python distribution/tooling/release_manifest.py attest-signature \
            --artifact "$ARTIFACT" \
            --version "$RELEASE_VERSION" \
            --source-revision "$GITHUB_SHA" \
            --profile macos-direct --verified --notarized \
            --output "$ARTIFACT.signature.json"
      - name: Smoke native install, upgrade, launch and uninstall
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          bash distribution/desktop/macos/direct/smoke-install.sh \
            "distribution/artifacts/macos-direct/Quiltor-$RELEASE_VERSION.dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-dmg
          if-no-files-found: error
          path: |
            distribution/artifacts/macos-direct/Quiltor-${{ needs.version-check.outputs.version }}.dmg
            distribution/artifacts/macos-direct/Quiltor-${{ needs.version-check.outputs.version }}.dmg.signature.json
      - if: always()
        run: '[ ! -f "$RUNNER_TEMP/quiltor-signing.keychain-db" ] || security delete-keychain "$RUNNER_TEMP/quiltor-signing.keychain-db"'

  # Signing job (C-17, C-19): reads the Authenticode secrets, so never in a dry run.
  windows-direct:
    needs: [release-plan, release-context, version-check, release-gate, tests]
    if: >-
      needs.release-plan.outputs.release == 'true'
      && needs.tests.outputs.verdict == 'full-success'
      && needs.release-plan.outputs.dry_run == 'false'
      && needs.version-check.outputs.windows_direct == 'true'
    runs-on: windows-2025
    env:
      QUILTOR_BUILD_NUMBER: ${{ github.run_number }}
      QUILTOR_REQUIRE_SIGNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          package-manager-cache: false # an artifact job restores no cache
      - run: npm ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - name: Install the pinned native packaging toolchain
        run: |
          python distribution/tooling/dependency_lock_contract.py check
          python -m pip install --require-hashes `
            --requirement distribution/python-build-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation `
            --requirement distribution/desktop/windows/direct/requirements.lock
      - name: Install the checksum-locked Inno Setup compiler
        shell: pwsh
        run: |
          $inno = (Get-Content distribution/toolchains.json -Raw | ConvertFrom-Json).nativePackagingTools.innoSetup
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$($inno.version).exe"
          Invoke-WebRequest -Uri $inno.downloadUrl -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $inno.sha256) {
            throw "Inno Setup checksum mismatch: expected $($inno.sha256), got $actual."
          }
          $process = Start-Process -FilePath $installer -ArgumentList "/SP-", "/VERYSILENT", "/ALLUSERS", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }
      - name: Require and configure Authenticode
        shell: pwsh
        env:
          CERTIFICATE_P12: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_P12)) {
            throw "WINDOWS_CERTIFICATE_P12 is required for a release build."
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required for a release build."
          }
          $path = Join-Path $env:RUNNER_TEMP "quiltor-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE_P12))
          "QUILTOR_WINDOWS_CERTIFICATE_PATH=$path" | Out-File $env:GITHUB_ENV -Append
          "QUILTOR_WINDOWS_CERTIFICATE_PASSWORD=$env:CERTIFICATE_PASSWORD" | Out-File $env:GITHUB_ENV -Append
      - shell: pwsh
        run: ./distribution/desktop/windows/direct/build.ps1
      - name: Attest the verified Authenticode installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          $artifact = "distribution/artifacts/windows-direct/Quiltor-Setup-$env:RELEASE_VERSION.exe"
          python distribution/tooling/release_manifest.py attest-signature `
            --artifact $artifact `
            --version "$env:RELEASE_VERSION" `
            --source-revision $env:GITHUB_SHA `
            --profile windows-direct --verified `
            --output "$artifact.signature.json"
          if ($LASTEXITCODE -ne 0) { throw "Signature attestation failed." }
      - name: Smoke native install, upgrade, launch and uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: >-
          ./distribution/desktop/windows/direct/smoke-install.ps1
          -CurrentInstaller
          "distribution/artifacts/windows-direct/Quiltor-Setup-$env:RELEASE_VERSION.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            distribution/artifacts/windows-direct/Quiltor-Setup-${{ needs.version-check.outputs.version }}.exe
            distribution/artifacts/windows-direct/Quiltor-Setup-${{ needs.version-check.outputs.version }}.exe.signature.json
      - name: Remove signing material
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP\quiltor-signing.pfx" -Force -ErrorAction SilentlyContinue

  # Manifest job (C-17): its artifact is the one input Publish acts on. It runs again in every
  # attempt that re-runs anything upstream, so it checks the head and the tag again first.
  release-manifest:
    needs:
      [
        release-plan,
        version-check,
        release-gate,
        tests,
        web-image,
        backup-image,
        python-package,
        macos-direct,
        windows-direct,
      ]
    if: >-
      ${{
        !cancelled()
        && needs.release-plan.outputs.release == 'true'
        && needs.tests.outputs.verdict == 'full-success'
        && needs.release-plan.outputs.dry_run == 'false'
        && needs.version-check.result == 'success'
        && needs.release-gate.result == 'success'
        && needs.web-image.result == 'success'
        && needs.backup-image.result == 'success'
        && needs.python-package.result == 'success'
        && (
          (needs.version-check.outputs.macos_direct == 'true'
            && needs['macos-direct'].result == 'success')
          || (needs.version-check.outputs.macos_direct == 'false'
            && needs['macos-direct'].result == 'skipped')
        )
        && (
          (needs.version-check.outputs.windows_direct == 'true'
            && needs['windows-direct'].result == 'success')
          || (needs.version-check.outputs.windows_direct == 'false'
            && needs['windows-direct'].result == 'skipped')
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the current main head again
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          [ "$GITHUB_SHA" = "$MAIN_SHA" ] \
            || { echo "::error::main moved to $MAIN_SHA; release revision $GITHUB_SHA is stale"; exit 1; }
      - name: Require the version tag to be absent again
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          TAGS="$(gh api "repos/$REPOSITORY/git/matching-refs/tags/v$VERSION" --jq '.[].ref')"
          if grep -qxF "refs/tags/v$VERSION" <<<"$TAGS"; then
            echo "::error::v$VERSION was tagged since version-check ran"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.version-check.outputs.macos_direct == 'true'
        with:
          name: macos-dmg
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.version-check.outputs.windows_direct == 'true'
        with:
          name: windows-installer
          path: release-assets
      - name: Create the manifest from required and explicitly enabled artifacts
        env:
          MACOS_DIRECT: ${{ needs.version-check.outputs.macos_direct }}
          WINDOWS_DIRECT: ${{ needs.version-check.outputs.windows_direct }}
        run: |
          set -euo pipefail
          args=(
            --version "${{ needs.version-check.outputs.version }}"
            --source-revision "$GITHUB_SHA"
            --web-image "${{ needs.web-image.outputs.image }}"
            --backup-image "${{ needs.backup-image.outputs.image }}"
            --artifact "release-assets/quiltor-${{ needs.version-check.outputs.version }}-py3-none-any.whl"
            --artifact "release-assets/quiltor-${{ needs.version-check.outputs.version }}.tar.gz"
          )
          if [ "$MACOS_DIRECT" = true ]; then
            args+=(--artifact "release-assets/Quiltor-${{ needs.version-check.outputs.version }}.dmg")
          fi
          if [ "$WINDOWS_DIRECT" = true ]; then
            args+=(--artifact "release-assets/Quiltor-Setup-${{ needs.version-check.outputs.version }}.exe")
          fi
          args+=(--output release-manifest.json)
          python distribution/tooling/release_manifest.py create "${args[@]}"
      - name: Verify the complete manifest hand-off before upload
        run: >-
          python distribution/tooling/release_manifest.py verify
          --manifest release-manifest.json
          --artifact-dir release-assets
          --source-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifest
          if-no-files-found: error
          path: release-manifest.json

  # Turns a release run that produced nothing into a red run instead of a green one: a called
  # workflow and skipped jobs alone would conclude success.
  release-complete:
    name: Release run complete
    needs:
      [
        release-plan,
        tests,
        web-image,
        backup-image,
        python-package,
        macos-direct,
        windows-direct,
        release-manifest,
      ]
    if: ${{ always() && needs.release-plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the verdict and every artifact
        env:
          DRY_RUN: ${{ needs.release-plan.outputs.dry_run }}
          VERDICT: ${{ needs.tests.outputs.verdict }}
          MANIFEST: ${{ needs.release-manifest.result }}
          WEB: ${{ needs.web-image.result }}
          BACKUP: ${{ needs.backup-image.result }}
          PACKAGE: ${{ needs.python-package.result }}
          MACOS: ${{ needs.macos-direct.result }}
          WINDOWS: ${{ needs.windows-direct.result }}
        run: |
          set -euo pipefail
          [ "$VERDICT" = full-success ] \
            || { echo "::error::the full test matrix verdict is '$VERDICT', not full-success"; exit 1; }
          for result in "$WEB" "$BACKUP" "$PACKAGE"; do
            [ "$result" = success ] || { echo "::error::an artifact job is $result"; exit 1; }
          done
          if [ "$DRY_RUN" = true ]; then
            [ "$MACOS" = skipped ] && [ "$WINDOWS" = skipped ] \
              || { echo "::error::a dry run ran a signing job ($MACOS, $WINDOWS)"; exit 1; }
            [ "$MANIFEST" = skipped ] \
              || { echo "::error::a dry run produced a manifest ($MANIFEST)"; exit 1; }
          else
            [ "$MANIFEST" = success ] || { echo "::error::release-manifest is $MANIFEST"; exit 1; }
          fi
