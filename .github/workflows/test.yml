name: Test

# Everything that can fail without a Mac, a store account or a signing
# certificate. release.yml deliberately does not depend on this: releasing is
# triggered by a VERSION change on main, and by then this has already run on
# the pull request that changed it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # the floor in pyproject.toml, so failures here are real

      # No install step on purpose: server.py and everything under backend/ are
      # standard-library only, and the suite is unittest. If this ever needs a
      # pip install, something has grown a dependency it should not have.
      - name: Backend suite
        run: python -m unittest discover -s tests/backend -t tests/backend -v

      # The CLI host is the one part with a declared runtime dependency, and its
      # tests skip themselves without it -- which would let their patch targets
      # rot unnoticed. Installed afterwards so the run above still proves the
      # server path needs nothing.
      - name: CLI host, with its one dependency
        run: |
          python -m pip install --quiet "typer>=0.12"
          python -m unittest discover -s tests/backend -t tests/backend -p "test_cli_*.py" -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx vitest run

      # `npm run build` chains check:design, check:i18n and tsc -b before vite,
      # so this covers type errors, hardcoded UI strings and design-token drift
      # in one step -- the same gate a developer hits locally.
      - name: Type-check, gates and build
        run: npm run build

      # dist/ is committed (the wheel and the Docker image serve it), so a
      # source change without a rebuild ships a stale client. Vite's hashed
      # filenames make that easy to miss in review and impossible to miss here.
      - name: dist/ matches the sources
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi
