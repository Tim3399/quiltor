name: Test

permissions:
  contents: read

# Fast feedback for everything that can fail without a Mac, store account or
# signing certificate. A Release Build repeats the complete portable gate in
# its own workflow; this workflow's earlier result is never release evidence.
#
# Pull requests run Linux completely and a smoke test on Windows and macOS; main, a manual run
# and a caller asking for it run the full Windows and macOS matrix. The `plan` job decides that
# in one place -- see "Matrix" in docs/quality/ci.md. On a pull request it also selects the job
# groups the changed paths need (.github/test-paths.json); full mode always runs every group --
# see "Path filter" there.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the full Windows and macOS matrix"
        type: boolean
        default: true
  workflow_call:
    inputs:
      full_matrix:
        description: "Run the full matrix (release mode); reduce only on purpose"
        type: boolean
        default: true

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The only place that decides between the full and the reduced matrix. Fail-safe: the matrix
  # is reduced only for a pull request or an explicit `full_matrix: false`. An explicit true
  # wins even when a caller came from a pull request (in a called workflow, github.event_name is
  # the caller's event). The input is compared as text because GitHub coerces a missing input
  # (null) to equal false; format() turns it into '' and keeps the default full. Jobs read the
  # output, never github.event_name -- workflow_contract.py holds both in place.
  plan:
    name: Plan the matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read # the sparse checkout of the path filter on a pull request
    outputs:
      full_matrix: ${{ steps.decide.outputs.full_matrix }}
      # One run_<group> per group of .github/test-paths.json. Full mode is true without asking
      # the filter; otherwise only a literal 'false' from a finished filter switches a group off.
      run_checks: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_checks == 'false' && 'false' || 'true') }}
      run_python: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_python == 'false' && 'false' || 'true') }}
      run_rust: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_rust == 'false' && 'false' || 'true') }}
      run_client: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_client == 'false' && 'false' || 'true') }}
      run_browser: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_browser == 'false' && 'false' || 'true') }}
      run_lint: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_lint == 'false' && 'false' || 'true') }}
    steps:
      - id: decide
        env:
          FULL_MATRIX: ${{ inputs.full_matrix == true || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name != 'pull_request' && format('{0}', inputs.full_matrix) != 'false') }}
        run: echo "full_matrix=$FULL_MATRIX" >> "$GITHUB_OUTPUT"

      # The path filter reads paths only on a pull request in reduced mode. It needs the git
      # history two commits deep -- the merge commit GitHub builds for the pull request and its
      # parents -- and no file of the pull request: the working tree holds VERSION only. See
      # "Path filter" in docs/quality/ci.md.
      - name: Check out the path filter
        if: steps.decide.outputs.full_matrix != 'true' && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            VERSION
      - name: Set up Python for the path filter
        if: steps.decide.outputs.full_matrix != 'true' && github.event_name == 'pull_request'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      # The filter and its rules come from the base (HEAD^1), never from the pull request, so a
      # pull request that changes them is judged by the rules it replaces. A base without them
      # (the pull request that introduces the filter) writes nothing: every run_<group> is true.
      - id: filter
        name: Select job groups by changed path
        if: steps.decide.outputs.full_matrix != 'true' && github.event_name == 'pull_request'
        run: |
          base="$RUNNER_TEMP/path-filter-base"
          mkdir -p "$base/.github" "$base/distribution/tooling"
          if git show HEAD^1:.github/test-paths.json > "$base/.github/test-paths.json" &&
            git show HEAD^1:distribution/tooling/path_filter.py > "$base/distribution/tooling/path_filter.py"; then
            python "$base/distribution/tooling/path_filter.py" plan --repository . --merge HEAD --output "$GITHUB_OUTPUT"
          else
            echo "::warning::the base has no readable path filter, running everything"
          fi

  backend:
    needs: plan
    if: needs.plan.outputs.run_python == 'true'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10" # last 3.12 patch with setup-python builds for all three systems

      # Install the declared core dependencies. OIDC signature verification is
      # a supported web/desktop path and must never be skipped accidentally.
      - name: Install declared Python dependencies
        run: python -m pip install --quiet -e .

      - name: Backend suite
        run: python -m unittest discover -s tests/python -t tests/python -v

      - name: Distribution and version contracts
        run: python distribution/tooling/profile_contract.py check-release

      - name: Cross-runtime contract registry
        run: node tools/quality/check_contracts.mjs

      - name: CLI host with declared dependencies
        run: python -m unittest discover -s tests/python -t tests/python -p "test_cli_*.py" -v

  portable-core:
    needs: plan
    if: needs.plan.outputs.run_rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - run: cargo --locked fmt --check
      - run: cargo --locked clippy --workspace --all-targets -- -D warnings
      - run: cargo --locked test --workspace --all-targets

      # cargo-deny reads the graph through `cargo metadata`, so it runs where the pinned Rust
      # toolchain already is. Same download rule as the lint binaries: pinned version and
      # SHA-256 from distribution/toolchains.json, then the command a developer runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"
      - name: Install the checksum-locked cargo-deny
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lint-bin"
          mkdir -p "$bin"
          url="$(jq -er '.lintTools["cargo-deny"].downloadUrl' distribution/toolchains.json)"
          sha256="$(jq -er '.lintTools["cargo-deny"].sha256' distribution/toolchains.json)"
          file="$RUNNER_TEMP/$(basename "$url")"
          curl --fail --silent --show-error --location --output "$file" "$url"
          echo "$sha256  $file" | sha256sum --check --strict
          tar -xzf "$file" -C "$bin" --strip-components=1 --wildcards "*/cargo-deny"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Rust advisories, licenses and sources
        run: npm run lint:cargo-deny

  frontend:
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: rustfmt

      - run: npm ci

      - name: Install the pinned Python formatter
        run: python -m pip install --quiet "ruff==0.16.4"

      - name: Install the pinned workflow linter
        run: >-
          python -m pip install --quiet --require-hashes --only-binary=:all:
          -r distribution/lint-tools.requirements.txt

      # pyright resolves typer, PyJWT and markdown-it-py through this interpreter;
      # without the project's dependencies every third-party import is unresolved. pystray,
      # Pillow and hatchling are optional packages that tray.py, make_icons.py and
      # hatch_build.py import for real, so they are installed too. pywebview is left out on
      # purpose: its imports carry a reportMissingImports suppression (docs/quality/linting.md).
      - name: Install the project for the type check
        run: python -m pip install --quiet -e . "pystray>=0.19" "Pillow>=10" "hatchling==1.31.0"

      # The whole local gate, not a list of its parts: every linter that `npm run check`
      # chains (formatting, zizmor, and whatever lint:* joins it later) runs here without
      # this file having to name it. The job has what check needs -- npm ci, Python with
      # ruff, zizmor and the project for pyright, Rust with rustfmt.
      - name: Check gates, formatting and linters
        run: npm run check

      - name: Unit tests
        if: needs.plan.outputs.run_client == 'true'
        run: npx vitest run

      # `npm run build` is the check:* gates followed by tsc -b and vite build. The gates ran a
      # few steps up inside `npm run check`, so this step runs only the tail of the build script.
      # workflow_contract.py compares it with package.json: a gate added to `build` but not to
      # `check`, or a changed tail, fails the contract instead of silently going unrun here.
      - name: Type-check and build
        if: needs.plan.outputs.run_client == 'true'
        run: npx tsc -b && npx vite build

      # dist/ is committed (the wheel and the Docker image serve it), so a
      # source change without a rebuild ships a stale client. Vite's hashed
      # filenames make that easy to miss in review and impossible to miss here.
      - name: dist/ matches the sources
        if: needs.plan.outputs.run_client == 'true'
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  # actionlint, hadolint, shellcheck and osv-scanner are standalone binaries, not npm or
  # PyPI packages.
  # Each is downloaded at the version distribution/toolchains.json pins and refused unless
  # its SHA-256 matches; the npm scripts then run the command a developer runs locally.
  # Locally they skip when not installed -- here a missing binary fails the job.
  workflow-docker-shell-lint:
    needs: plan
    if: needs.plan.outputs.run_lint == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"

      - name: Install the checksum-locked lint binaries
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lint-bin"
          mkdir -p "$bin"
          for tool in actionlint hadolint shellcheck osv-scanner; do
            url="$(jq -er ".lintTools[\"$tool\"].downloadUrl" distribution/toolchains.json)"
            sha256="$(jq -er ".lintTools[\"$tool\"].sha256" distribution/toolchains.json)"
            file="$RUNNER_TEMP/$(basename "$url")"
            curl --fail --silent --show-error --location --output "$file" "$url"
            echo "$sha256  $file" | sha256sum --check --strict
            case "$file" in
              *.tar.gz) tar -xzf "$file" -C "$bin" "$tool" ;;
              *.tar.xz) tar -xJf "$file" -C "$bin" --strip-components=1 --wildcards "*/$tool" ;;
              *) install -m 0755 "$file" "$bin/$tool" ;;
            esac
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Workflow lint
        run: npm run lint:actionlint

      - name: Dockerfile lint
        run: npm run lint:hadolint

      - name: Shell script lint
        run: npm run lint:shellcheck

      # Every lockfile against the OSV advisory database: package-lock.json, Cargo.lock and
      # the hash-locked Python release locks. Exceptions with reason and expiry live in
      # osv-scanner.toml.
      - name: Known vulnerabilities in dependencies
        run: npm run lint:osv

  # Product and design suites share four runners, so npm/Chromium setup is paid four times.
  # Every slot runs a part of both, cut by measured duration (test-shards.mjs in the dev tools,
  # and tests/playwright/durations.json): `--shard` cut by count, and since many product tests skip
  # themselves for a project, slot 1 ran 10.3 minutes of product tests and slot 2 4.2.
  # Slot 4 also runs the layout audit rules, about 9 s, which the assignment counts as offset.
  #
  # The browser jobs need only the plan, not frontend: they serve the committed dist/, take no
  # artifact and no output from frontend, and its result reaches the run through the browser-e2e
  # gate below. A red frontend still turns the run red; it no longer delays the browsers by 3.5 min.
  browser-e2e-shards:
    name: Browser E2E / slot ${{ matrix.slot }} of 4
    needs: plan
    if: needs.plan.outputs.run_browser == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - run: npm ci
      # apt with a time limit and one mirror switch; red if both attempts fail.
      - name: Install Chromium
        run: bash tools/dev/playwright-linux.sh
      - name: Install the application
        run: python -m pip install --quiet -e .
      - name: Start the application
        run: |
          python apps/web/server.py 8010 --no-open > "$RUNNER_TEMP/quiltor-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/quiltor-server.pid"
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8010/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/quiltor-server.log"
          exit 1
      # The rules project needs only Chromium, which this job installed above. One slot is
      # enough: the run is deterministic.
      - name: Layout audit rule tests
        if: matrix.slot == 4
        run: npm run test:audit-rules -- --reporter=line
      # select lists both suites, assigns all four slots, refuses unless every test lands in
      # exactly one, and has Playwright confirm that this slot's lists select exactly its tests.
      # A failed selection fails the slot; nothing runs on a list that was not confirmed.
      - name: Run product and design shards
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          set +e
          lists="$RUNNER_TEMP/test-lists"
          node tools/dev/test-shards.mjs select --os linux --slots 4 --slot "$SLOT" --offset 4=9000 --out-dir "$lists"
          select_status=$?
          product_status=1
          design_status=1
          if [ "$select_status" -eq 0 ]; then
            echo "Product browser tests of slot $SLOT"
            PLAYWRIGHT_WORKERS=1 PLAYWRIGHT_FULLY_PARALLEL=1 PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/reports/product.json \
              npx playwright test --test-list "$lists/product.txt" --output=test-results/product --reporter=line,json
            product_status=$?

            echo "Design browser tests of slot $SLOT"
            PLAYWRIGHT_WORKERS=2 PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/reports/design.json \
              npx playwright test --config playwright.design.config.ts \
              --test-list "$lists/design.txt" --output=test-results/design --reporter=line,json
            design_status=$?
          fi

          if [ "$select_status" -ne 0 ] || [ "$product_status" -ne 0 ] || [ "$design_status" -ne 0 ]; then
            echo "::error::Browser slot failures: select=$select_status product=$product_status design=$design_status"
            exit 1
          fi
      # The JSON reports carry each test's duration; tools/dev/test-shards.mjs update turns the
      # reports of a run into tests/playwright/durations.json. Kept on success too, briefly.
      - name: Upload test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-durations-linux-slot-${{ matrix.slot }}-of-4
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/reports/*.json
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-e2e-slot-${{ matrix.slot }}-of-4-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/quiltor-server.log

  # Keep this job ID stable: branch protection requires `browser-e2e`, while
  # the matrix above may grow or rebalance without changing the required check.
  #
  # It is also the gate over every job the path filter can switch off: a job must succeed,
  # and may be skipped only when the plan did not select it. Any other skip -- a failed need,
  # a broken condition -- and every failure or cancellation is red. A selection is written as
  # `!= 'false'`, so a missing plan output counts as selected and its skip fails here.
  browser-e2e:
    needs:
      - plan
      - backend
      - portable-core
      - frontend
      - workflow-docker-shell-lint
      - browser-e2e-shards
      - visual-baseline-reach
      - cross-platform-native
      - cross-platform-browser
      - cross-platform-smoke
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RESULT_BACKEND: ${{ needs['backend'].result }}
          SELECTED_BACKEND: ${{ needs.plan.outputs.run_python != 'false' }}
          RESULT_PORTABLE_CORE: ${{ needs['portable-core'].result }}
          SELECTED_PORTABLE_CORE: ${{ needs.plan.outputs.run_rust != 'false' }}
          RESULT_FRONTEND: ${{ needs['frontend'].result }}
          SELECTED_FRONTEND: ${{ needs.plan.outputs.run_checks != 'false' }}
          RESULT_WORKFLOW_DOCKER_SHELL_LINT: ${{ needs['workflow-docker-shell-lint'].result }}
          SELECTED_WORKFLOW_DOCKER_SHELL_LINT: ${{ needs.plan.outputs.run_lint != 'false' }}
          RESULT_BROWSER_E2E_SHARDS: ${{ needs['browser-e2e-shards'].result }}
          SELECTED_BROWSER_E2E_SHARDS: ${{ needs.plan.outputs.run_browser != 'false' }}
          RESULT_VISUAL_BASELINE_REACH: ${{ needs['visual-baseline-reach'].result }}
          SELECTED_VISUAL_BASELINE_REACH: ${{ needs.plan.outputs.run_browser != 'false' }}
          RESULT_CROSS_PLATFORM_NATIVE: ${{ needs['cross-platform-native'].result }}
          SELECTED_CROSS_PLATFORM_NATIVE: ${{ needs.plan.outputs.run_python != 'false' || needs.plan.outputs.run_rust != 'false' }}
          RESULT_CROSS_PLATFORM_BROWSER: ${{ needs['cross-platform-browser'].result }}
          SELECTED_CROSS_PLATFORM_BROWSER: ${{ needs.plan.outputs.full_matrix == 'true' && needs.plan.outputs.run_browser != 'false' }}
          RESULT_CROSS_PLATFORM_SMOKE: ${{ needs['cross-platform-smoke'].result }}
          SELECTED_CROSS_PLATFORM_SMOKE: ${{ needs.plan.outputs.full_matrix != 'true' && needs.plan.outputs.run_browser != 'false' }}
        run: |
          status=0
          require() {
            if [ "$2" = "success" ]; then
              echo "$1: success"
            elif [ "$2" = "skipped" ] && [ "$3" = "false" ]; then
              echo "$1: skipped, not selected by the plan"
            else
              echo "::error::$1 is $2 although the plan selected=$3; only success, or a skip the plan chose, passes."
              status=1
            fi
          }
          require plan "$PLAN_RESULT" true
          require backend "$RESULT_BACKEND" "$SELECTED_BACKEND"
          require portable-core "$RESULT_PORTABLE_CORE" "$SELECTED_PORTABLE_CORE"
          require frontend "$RESULT_FRONTEND" "$SELECTED_FRONTEND"
          require workflow-docker-shell-lint "$RESULT_WORKFLOW_DOCKER_SHELL_LINT" "$SELECTED_WORKFLOW_DOCKER_SHELL_LINT"
          require browser-e2e-shards "$RESULT_BROWSER_E2E_SHARDS" "$SELECTED_BROWSER_E2E_SHARDS"
          require visual-baseline-reach "$RESULT_VISUAL_BASELINE_REACH" "$SELECTED_VISUAL_BASELINE_REACH"
          require cross-platform-native "$RESULT_CROSS_PLATFORM_NATIVE" "$SELECTED_CROSS_PLATFORM_NATIVE"
          require cross-platform-browser "$RESULT_CROSS_PLATFORM_BROWSER" "$SELECTED_CROSS_PLATFORM_BROWSER"
          require cross-platform-smoke "$RESULT_CROSS_PLATFORM_SMOKE" "$SELECTED_CROSS_PLATFORM_SMOKE"
          exit "$status"

  # When a platform has no baseline set, visual-baseline.spec.ts skips itself there -- and
  # the suite reports green while comparing not a single pixel. This check names the gap
  # instead of letting it disappear behind a "skipped". It deliberately does not live in the
  # build script: otherwise nobody could build locally before every platform has its images.
  visual-baseline-reach:
    needs: plan
    if: needs.plan.outputs.run_browser == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"
      - name: Every comparing platform has images
        run: node tools/quality/check_visual_baseline_reach.mjs

  # Linux runs above, sharded and as the required check. These jobs add macOS and Windows:
  # the same suites, so a failure that only happens there becomes visible here instead of
  # landing during a release build.
  cross-platform-native:
    name: Core on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.run_python == 'true' || needs.plan.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      # The components belong to the action, not to rustup. Without them the first `cargo`
      # call installs the toolchain, then reads rust-toolchain.toml and adds clippy after the
      # fact -- on macos-15 that collides with the bin/cargo-clippy the runner image already
      # ships, and the job dies before the first test. Ubuntu has always done it this way.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Install declared Python dependencies
        run: python -m pip install --quiet -e .

      # Path separators, file locks and text encoding are where the three operating systems
      # really differ -- and this application writes files.
      - name: Backend suite
        run: python -m unittest discover -s tests/python -t tests/python

      # Formatting and clippy are platform independent and run once, on Linux.
      - name: Portable core
        run: cargo --locked test --workspace --all-targets

  # The full Windows and macOS matrix: the complete product and design suites on both systems.
  # Each slot runs one product and one design shard on the same runner, so the packages, Chromium
  # and the Windows media feature are set up once per slot instead of once per suite.
  #
  # Both suites are cut by measured duration, as on Linux (tools/dev/test-shards.mjs). The unit
  # tests run once per system, in slot 1, which the assignment counts as offset: 3.1 minutes on
  # Windows and 2.5 on macOS, measured in the run on 15e0b43.
  #
  # Windows keeps eight slots and at most 100 product tests per slot: Chromium exhausted the
  # runner's network buffers after more than 115 product tests even with serialized browser
  # contexts. macOS runs three slots; with two its first slot took 13.5 minutes.
  cross-platform-browser:
    name: Browser on ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.full_matrix == 'true' && needs.plan.outputs.run_browser == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            system: macos
            label: macos-15 / slot 1 of 3
            slot: 1
            slots: 3
            diagnostics: macos-15-1-of-3
          - os: macos-15
            system: macos
            label: macos-15 / slot 2 of 3
            slot: 2
            slots: 3
            diagnostics: macos-15-2-of-3
          - os: macos-15
            system: macos
            label: macos-15 / slot 3 of 3
            slot: 3
            slots: 3
            diagnostics: macos-15-3-of-3
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 1 of 8
            slot: 1
            slots: 8
            diagnostics: windows-2025-1-of-8
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 2 of 8
            slot: 2
            slots: 8
            diagnostics: windows-2025-2-of-8
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 3 of 8
            slot: 3
            slots: 8
            diagnostics: windows-2025-3-of-8
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 4 of 8
            slot: 4
            slots: 8
            diagnostics: windows-2025-4-of-8
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 5 of 8
            slot: 5
            slots: 8
            diagnostics: windows-2025-5-of-8
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 6 of 8
            slot: 6
            slots: 8
            diagnostics: windows-2025-6-of-8
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 7 of 8
            slot: 7
            slots: 8
            diagnostics: windows-2025-7-of-8
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 8 of 8
            slot: 8
            slots: 8
            diagnostics: windows-2025-8-of-8
    env:
      PYTHONPATH: src
    steps:
      # Windows hands out ephemeral TCP ports from 49152-65535 only (16384 ports, the default since
      # Vista; Microsoft KB 929851). A browser slot opens enough short-lived connections to the
      # server that the runner ran out of socket buffers (F2, WSAENOBUFS, docs/quality/ci.md).
      # 10000 + 55535 ends at 65534, the largest range Windows accepts. Fails the job when refused.
      - name: Widen the dynamic TCP port range
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          netsh int ipv4 show dynamicport tcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        if: matrix.slot == 1
        run: npx vitest run

      - name: Install the application
        run: python -m pip install --quiet -e .

      - name: Start the application
        shell: bash
        run: |
          python apps/web/server.py 8010 --no-open > "$RUNNER_TEMP/quiltor-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8010/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/quiltor-server.log"
          exit 1

      # Both suites run even when the first fails; the step fails if either did.
      # visual-baseline.spec.ts is part of the product suite and compares this system's images.
      # Windows keeps one worker per suite: Chromium failed with ERR_NO_BUFFER_SPACE there.
      - name: Run product and design shards
        env:
          PLAYWRIGHT_WORKERS: ${{ matrix.os == 'windows-2025' && '1' || '2' }}
          SYSTEM: ${{ matrix.system }}
          SLOT: ${{ matrix.slot }}
          SLOTS: ${{ matrix.slots }}
        shell: bash
        run: |
          set +e
          lists="$RUNNER_TEMP/test-lists"
          if [ "$SYSTEM" = windows ]; then
            shape=(--max-tests 100 --offset "1=186000")
          else
            shape=(--offset "1=150000")
          fi
          node tools/dev/test-shards.mjs select --os "$SYSTEM" --slots "$SLOTS" --slot "$SLOT" "${shape[@]}" --out-dir "$lists"
          select_status=$?
          product_status=1
          design_status=1
          if [ "$select_status" -eq 0 ]; then
            echo "Product browser tests of slot $SLOT"
            PLAYWRIGHT_FULLY_PARALLEL=1 PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/reports/product.json \
              npx playwright test --test-list "$lists/product.txt" --output=test-results/product --reporter=line,json
            product_status=$?

            echo "Design browser tests of slot $SLOT"
            PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/reports/design.json \
              npx playwright test --config playwright.design.config.ts \
              --test-list "$lists/design.txt" --output=test-results/design --reporter=line,json
            design_status=$?
          fi

          if [ "$select_status" -ne 0 ] || [ "$product_status" -ne 0 ] || [ "$design_status" -ne 0 ]; then
            echo "::error::Browser slot failures: select=$select_status product=$product_status design=$design_status"
            exit 1
          fi

      - name: Upload test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-durations-${{ matrix.diagnostics }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/reports/*.json

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-platform-browser-${{ matrix.diagnostics }}-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/quiltor-server.log

  # The reduced matrix's stand-in for the job above: on a pull request, one runner per system
  # runs the unit tests and the product specs where the systems differ most -- the pixel
  # comparison against this system's baselines, opening a world and a chapter, and manuscript
  # import and export, which read and write files. About 50 of the 531 product tests, well under
  # the count where Windows ran out of network buffers. A Windows- or macOS-only failure in the
  # rest of the suites shows up on main, which always runs the full matrix.
  cross-platform-smoke:
    name: Smoke on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.full_matrix != 'true' && needs.plan.outputs.run_browser == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      PYTHONPATH: src
    steps:
      # Windows hands out ephemeral TCP ports from 49152-65535 only (16384 ports, the default since
      # Vista; Microsoft KB 929851). A browser slot opens enough short-lived connections to the
      # server that the runner ran out of socket buffers (F2, WSAENOBUFS, docs/quality/ci.md).
      # 10000 + 55535 ends at 65534, the largest range Windows accepts. Fails the job when refused.
      - name: Widen the dynamic TCP port range
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          netsh int ipv4 show dynamicport tcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npx vitest run

      - name: Install the application
        run: python -m pip install --quiet -e .

      - name: Start the application
        shell: bash
        run: |
          python apps/web/server.py 8010 --no-open > "$RUNNER_TEMP/quiltor-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8010/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/quiltor-server.log"
          exit 1

      - name: Product smoke specs
        env:
          PLAYWRIGHT_WORKERS: ${{ matrix.os == 'windows-2025' && '1' || '2' }}
        shell: bash
        run: >-
          npx playwright test
          tests/e2e/visual-baseline.spec.ts
          tests/e2e/world-gate-responsive.spec.ts
          tests/e2e/chapter-navigation.spec.ts
          tests/e2e/manuscript-import.spec.ts
          tests/e2e/manuscript-export.spec.ts
          --output=test-results/product --reporter=line

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-platform-smoke-${{ matrix.os }}-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/quiltor-server.log
