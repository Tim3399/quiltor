name: Test

permissions:
  contents: read

# Fast feedback for everything that can fail without a Mac, store account or
# signing certificate. A Release Build repeats the complete portable gate in
# its own workflow; this workflow's earlier result is never release evidence.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7" # letzter 3.14-Patch mit setup-python-Bauten fuer alle drei Systeme

      # Install the declared core dependencies. OIDC signature verification is
      # a supported web/desktop path and must never be skipped accidentally.
      - name: Install declared Python dependencies
        run: python -m pip install --quiet -e .

      - name: Backend suite
        run: python -m unittest discover -s tests/python -t tests/python -v

      - name: Distribution and version contracts
        run: python distribution/tooling/profile_contract.py check-release

      - name: Cross-runtime contract registry
        run: node tools/quality/check_contracts.mjs

      - name: CLI host with declared dependencies
        run: python -m unittest discover -s tests/python -t tests/python -p "test_cli_*.py" -v

  portable-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - run: cargo --locked fmt --check
      - run: cargo --locked clippy --workspace --all-targets -- -D warnings
      - run: cargo --locked test --workspace --all-targets

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - run: npm ci

      - name: Install the pinned Python formatter
        run: python -m pip install --quiet "ruff==0.16.4"

      - name: Formatting contract
        run: npm run check:format

      - name: Unit tests
        run: npx vitest run

      # `npm run build` chains check:design, check:i18n and tsc -b before vite,
      # so this covers type errors, hardcoded UI strings and design-token drift
      # in one step -- the same gate a developer hits locally.
      - name: Type-check, gates and build
        run: npm run build

      # dist/ is committed (the wheel and the Docker image serve it), so a
      # source change without a rebuild ships a stale client. Vite's hashed
      # filenames make that easy to miss in review and impossible to miss here.
      - name: dist/ matches the sources
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  # Product and design coverage use different shard counts, but share four
  # runners so npm/Chromium setup is paid four times instead of seven. Slots
  # 1-3 run one product and one design shard; slot 4 completes design coverage.
  browser-e2e-shards:
    name: Browser E2E / slot ${{ matrix.slot }} of 4
    needs: frontend
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: 1
            product_shard: "1/3"
            design_shard: "1/4"
          - slot: 2
            product_shard: "2/3"
            design_shard: "2/4"
          - slot: 3
            product_shard: "3/3"
            design_shard: "3/4"
          - slot: 4
            product_shard: ""
            design_shard: "4/4"
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.product_shard != ''
        with:
          python-version: "3.14.7"
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install the application
        if: matrix.product_shard != ''
        run: python -m pip install --quiet -e .
      - name: Start the application
        if: matrix.product_shard != ''
        run: |
          python apps/web/server.py 8000 --no-open > "$RUNNER_TEMP/quiltor-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/quiltor-server.pid"
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/quiltor-server.log"
          exit 1
      - name: Run product and design shards
        env:
          PRODUCT_SHARD: ${{ matrix.product_shard }}
          DESIGN_SHARD: ${{ matrix.design_shard }}
        run: |
          set +e
          product_status=0
          if [ -n "$PRODUCT_SHARD" ]; then
            echo "Product browser shard $PRODUCT_SHARD"
            PLAYWRIGHT_WORKERS=1 npx playwright test --shard="$PRODUCT_SHARD" --output=test-results/product --reporter=line
            product_status=$?
          fi

          echo "Design browser shard $DESIGN_SHARD"
          PLAYWRIGHT_WORKERS=2 npx playwright test --config playwright.design.config.ts \
            --shard="$DESIGN_SHARD" --output=test-results/design --reporter=line
          design_status=$?

          if [ "$product_status" -ne 0 ] || [ "$design_status" -ne 0 ]; then
            echo "::error::Browser shard failures: product=$product_status design=$design_status"
            exit 1
          fi
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-e2e-slot-${{ matrix.slot }}-of-4-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/quiltor-server.log

  # Keep this job ID stable: branch protection requires `browser-e2e`, while
  # the matrix above may grow or rebalance without changing the required check.
  browser-e2e:
    needs: browser-e2e-shards
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every browser shard
        env:
          SHARD_RESULT: ${{ needs.browser-e2e-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::At least one browser E2E matrix slot failed or was cancelled ($SHARD_RESULT)."
            exit 1
          fi

  # Fehlt fuer eine Plattform der Baseline-Satz, weicht visual-baseline.spec.ts dort aus --
  # und die Suite meldet gruen, obwohl sie kein einziges Pixel verglichen hat. Diese Pruefung
  # nennt die Luecke beim Namen, statt sie unter einem "skipped" verschwinden zu lassen. Sie
  # steht bewusst nicht im Build-Skript: sonst koennte niemand lokal bauen, bevor jede
  # Plattform ihre Bilder hat.
  visual-baseline-reach:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Jede vergleichende Plattform hat Bilder
        run: node tools/quality/check_visual_baseline_reach.mjs

  # Linux laeuft oben, geschaerdet und als Pflichtcheck. Diese beiden Jobs holen macOS und
  # Windows nach: dieselben Suiten, ungeschaerdet, damit ein Fehler, der nur dort auftritt,
  # sichtbar wird statt erst beim Release-Build aufzuschlagen.
  cross-platform-native:
    name: Kern auf ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      # Die Komponenten gehoeren an die Action, nicht an rustup. Ohne sie installiert der
      # Aufruf von `cargo` die Toolchain, liest dann rust-toolchain.toml und traegt clippy
      # nach -- auf macos-15 kollidiert das mit dem bin/cargo-clippy, das im Runner-Image
      # schon liegt, und der Job stirbt vor dem ersten Test. Ubuntu macht es seit jeher so.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Install declared Python dependencies
        run: python -m pip install --quiet -e .

      # Pfadtrennzeichen, Dateisperren und Textkodierung sind die Stellen, an denen sich die
      # drei Betriebssysteme wirklich unterscheiden -- und die Anwendung schreibt Dateien.
      - name: Backend suite
        run: python -m unittest discover -s tests/python -t tests/python

      # Formatierung und Clippy sind plattformunabhaengig und laufen einmal unter Linux.
      - name: Portable core
        run: cargo --locked test --workspace --all-targets

  cross-platform-browser:
    name: Browser auf ${{ matrix.os }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npx vitest run

      - name: Install the application
        run: python -m pip install --quiet -e .

      - name: Start the application
        shell: bash
        run: |
          python apps/web/server.py 8000 --no-open > "$RUNNER_TEMP/quiltor-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/quiltor-server.log"
          exit 1

      # Ungeschaerdet: drei Runner-Stunden fuer eine Aufteilung zu bezahlen lohnt sich erst
      # bei der Laufzeit, die Linux hat. visual-baseline.spec.ts liegt in dieser Suite und
      # vergleicht hier die Bilder dieser Plattform.
      - name: Product suite
        shell: bash
        run: PLAYWRIGHT_WORKERS=1 npx playwright test --output=test-results/product --reporter=line

      - name: Design suite
        shell: bash
        run: |
          PLAYWRIGHT_WORKERS=2 npx playwright test --config playwright.design.config.ts \
            --output=test-results/design --reporter=line

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-platform-browser-${{ matrix.os }}-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/quiltor-server.log
