name: Test

permissions:
  contents: read

# Fast feedback for everything that can fail without a Mac, store account or
# signing certificate. A Release Build repeats the complete portable gate in
# its own workflow; this workflow's earlier result is never release evidence.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10" # last 3.12 patch with setup-python builds for all three systems

      # Install the declared core dependencies. OIDC signature verification is
      # a supported web/desktop path and must never be skipped accidentally.
      - name: Install declared Python dependencies
        run: python -m pip install --quiet -e .

      - name: Backend suite
        run: python -m unittest discover -s tests/python -t tests/python -v

      - name: Distribution and version contracts
        run: python distribution/tooling/profile_contract.py check-release

      - name: Cross-runtime contract registry
        run: node tools/quality/check_contracts.mjs

      - name: CLI host with declared dependencies
        run: python -m unittest discover -s tests/python -t tests/python -p "test_cli_*.py" -v

  portable-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - run: cargo --locked fmt --check
      - run: cargo --locked clippy --workspace --all-targets -- -D warnings
      - run: cargo --locked test --workspace --all-targets

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - run: npm ci

      - name: Install the pinned Python formatter
        run: python -m pip install --quiet "ruff==0.16.4"

      - name: Formatting contract
        run: npm run check:format

      - name: Unit tests
        run: npx vitest run

      # `npm run build` chains check:design, check:i18n and tsc -b before vite,
      # so this covers type errors, hardcoded UI strings and design-token drift
      # in one step -- the same gate a developer hits locally.
      - name: Type-check, gates and build
        run: npm run build

      # dist/ is committed (the wheel and the Docker image serve it), so a
      # source change without a rebuild ships a stale client. Vite's hashed
      # filenames make that easy to miss in review and impossible to miss here.
      - name: dist/ matches the sources
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  # Product and design coverage use different shard counts, but share four
  # runners so npm/Chromium setup is paid four times instead of seven. Slots
  # 1-3 run one product and one design shard; slot 4 completes design coverage.
  browser-e2e-shards:
    name: Browser E2E / slot ${{ matrix.slot }} of 4
    needs: frontend
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: 1
            product_shard: "1/3"
            design_shard: "1/4"
          - slot: 2
            product_shard: "2/3"
            design_shard: "2/4"
          - slot: 3
            product_shard: "3/3"
            design_shard: "3/4"
          - slot: 4
            product_shard: ""
            design_shard: "4/4"
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.product_shard != ''
        with:
          python-version: "3.12.10"
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install the application
        if: matrix.product_shard != ''
        run: python -m pip install --quiet -e .
      - name: Start the application
        if: matrix.product_shard != ''
        run: |
          python apps/web/server.py 8010 --no-open > "$RUNNER_TEMP/quiltor-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/quiltor-server.pid"
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8010/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/quiltor-server.log"
          exit 1
      - name: Run product and design shards
        env:
          PRODUCT_SHARD: ${{ matrix.product_shard }}
          DESIGN_SHARD: ${{ matrix.design_shard }}
        run: |
          set +e
          product_status=0
          if [ -n "$PRODUCT_SHARD" ]; then
            echo "Product browser shard $PRODUCT_SHARD"
            PLAYWRIGHT_WORKERS=1 npx playwright test --shard="$PRODUCT_SHARD" --output=test-results/product --reporter=line
            product_status=$?
          fi

          echo "Design browser shard $DESIGN_SHARD"
          PLAYWRIGHT_WORKERS=2 npx playwright test --config playwright.design.config.ts \
            --shard="$DESIGN_SHARD" --output=test-results/design --reporter=line
          design_status=$?

          if [ "$product_status" -ne 0 ] || [ "$design_status" -ne 0 ]; then
            echo "::error::Browser shard failures: product=$product_status design=$design_status"
            exit 1
          fi
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-e2e-slot-${{ matrix.slot }}-of-4-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/quiltor-server.log

  # Keep this job ID stable: branch protection requires `browser-e2e`, while
  # the matrix above may grow or rebalance without changing the required check.
  browser-e2e:
    needs: browser-e2e-shards
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every browser shard
        env:
          SHARD_RESULT: ${{ needs.browser-e2e-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::At least one browser E2E matrix slot failed or was cancelled ($SHARD_RESULT)."
            exit 1
          fi

  # When a platform has no baseline set, visual-baseline.spec.ts skips itself there -- and
  # the suite reports green while comparing not a single pixel. This check names the gap
  # instead of letting it disappear behind a "skipped". It deliberately does not live in the
  # build script: otherwise nobody could build locally before every platform has its images.
  visual-baseline-reach:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"
      - name: Every comparing platform has images
        run: node tools/quality/check_visual_baseline_reach.mjs

  # Linux runs above, sharded and as the required check. These jobs add macOS and Windows:
  # the same suites, so a failure that only happens there becomes visible here instead of
  # landing during a release build.
  cross-platform-native:
    name: Core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      # The components belong to the action, not to rustup. Without them the first `cargo`
      # call installs the toolchain, then reads rust-toolchain.toml and adds clippy after the
      # fact -- on macos-15 that collides with the bin/cargo-clippy the runner image already
      # ships, and the job dies before the first test. Ubuntu has always done it this way.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Install declared Python dependencies
        run: python -m pip install --quiet -e .

      # Path separators, file locks and text encoding are where the three operating systems
      # really differ -- and this application writes files.
      - name: Backend suite
        run: python -m unittest discover -s tests/python -t tests/python

      # Formatting and clippy are platform independent and run once, on Linux.
      - name: Portable core
        run: cargo --locked test --workspace --all-targets

  # Both suites used to run one after the other in a single job: product first, then design,
  # together over twenty minutes on Windows. Split apart they are two jobs side by side --
  # the wall clock now shows only the longer of the two, and what it costs is a second setup
  # per system rather than a third runner hour for a four-way shard.
  #
  # The design suite does not need the application at all: it runs against the design
  # gallery, which its own config starts. Split off, it also skips Python, the install and
  # the server start.
  cross-platform-product:
    name: Product on ${{ matrix.os }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npx vitest run

      - name: Install the application
        run: python -m pip install --quiet -e .

      - name: Start the application
        shell: bash
        run: |
          python apps/web/server.py 8010 --no-open > "$RUNNER_TEMP/quiltor-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8010/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/quiltor-server.log"
          exit 1

      # Two Windows runs exhausted Chromium's network buffers while fetching different
      # workspace chunks (ERR_NO_BUFFER_SPACE). Serialize that runner's browser contexts
      # to bound concurrent connections; keep every product test and assertion enabled.
      # visual-baseline.spec.ts lives in this suite and compares this system's images.
      - name: Product suite
        env:
          PLAYWRIGHT_WORKERS: ${{ matrix.os == 'windows-2025' && '1' || '2' }}
        shell: bash
        run: npx playwright test --output=test-results/product --reporter=line

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-platform-product-${{ matrix.os }}-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/quiltor-server.log

  cross-platform-design:
    name: Design on ${{ matrix.os }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Design suite
        shell: bash
        run: |
          PLAYWRIGHT_WORKERS=2 npx playwright test --config playwright.design.config.ts \
            --output=test-results/design --reporter=line

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-platform-design-${{ matrix.os }}-diagnostics
          if-no-files-found: ignore
          path: test-results/**
