name: Test

permissions:
  contents: read

# Fast feedback on pull requests and manual dispatches. Pushes to main reach this workflow only
# through release.yml, which calls it with full_matrix: true and builds artifacts only after its
# browser-e2e job reports full-success. A separate run of this workflow is never release
# evidence.
#
# The verdict (T-345, "Verdict" in docs/quality/ci.md) is one of three values. full-success:
# every job of the full matrix ran and passed. reduced-success: a reduced run passed.
# tree-reused: reserved for a run that ends early because a run on the same tree already
# tested it -- it tested nothing itself, so it is never full-success and never release
# evidence. Beside the verdict the gate records the profile (full or integration), the run and
# its attempt, as outputs and in the artifact test-verdict (verdict.json).
#
# Pull requests and a manual run of the integration profile (the default) run Linux completely
# and Core and a smoke test on Windows; a manual run of the full profile, a run the plan raises
# to full on a native change, and a caller run the full Windows and macOS matrix. The `plan` job
# decides that in one place -- see "Matrix" and "Profiles" in docs/quality/ci.md. On a pull request it also selects the job groups
# the changed paths need (.github/test-paths.json); full mode always runs every group -- see
# "Path filter" there.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      # T-341 part B: integration runs Linux completely and Core and Smoke on Windows; full adds
      # the Windows browser slots and macOS. The plan job raises integration to full on a
      # native change since the run's base, and never lowers full.
      profile:
        description: "integration (Linux, Windows Core and Smoke) or full (every system)"
        type: choice
        options:
          - integration
          - full
        default: integration
      # Optional, on request only (T-179, D-167): starts llama-conformance.yml beside the run.
      # Dispatch only -- a caller such as release.yml cannot ask for it.
      llama_conformance:
        description: "Also run the llama-server conformance (downloads a runtime and a model)"
        type: boolean
        default: false
      llama_spike:
        description: "llama conformance: allow a model with no pinned sha256 and print its digest"
        type: boolean
        default: false
      # T-272: the desktop CSP probe, outside the matrix and outside the verdict. Only a manual
      # run that asks for it starts it; pull requests, pushes and release calls never do.
      desktop_csp_probe:
        description: "Also open the desktop window on macOS under each CSP mode (T-272)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_matrix:
        description: "Run the full matrix (release mode); reduce only on purpose"
        type: boolean
        default: true
    outputs:
      verdict:
        description: "full-success only when every job the full matrix requires succeeded"
        value: ${{ jobs.browser-e2e.outputs.verdict }}
      profile:
        description: "full or integration: the profile the verdict was reached with"
        value: ${{ jobs.browser-e2e.outputs.profile }}
      run_id:
        description: "The run that produced the verdict"
        value: ${{ jobs.browser-e2e.outputs.run_id }}
      run_attempt:
        description: "The attempt of that run that produced the verdict"
        value: ${{ jobs.browser-e2e.outputs.run_attempt }}

# Pull requests cancel their superseded runs, and so does a manual run of the integration
# profile: a newer dispatch on the same ref replaces it. A manual full run shares a group per ref
# but is never cancelled, so a release's dry run cannot lose it. Only a dispatch declares the
# profile input; a call from release.yml reads it as null and gets a group of its own, so no run
# can cancel the release's tests. In a call, github.* is the caller's context, so the run_id is
# the caller's run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-pr-{0}', github.ref) || format('{0}', inputs.profile) != '' && format('test-{0}-{1}', github.ref, inputs.profile) || format('test-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.profile == 'integration' }}

# Playwright workers per runner: the one place to change them, one value per system (T-39,
# "Workers per runner" in docs/quality/ci.md). Linux sets the product and the design suite
# apart; Windows and macOS give both suites, and the smoke specs, the same count. Windows is
# held at one by Chromium's ERR_NO_BUFFER_SPACE (F2).
env:
  WORKERS_LINUX_PRODUCT: "1"
  WORKERS_LINUX_DESIGN: "2"
  WORKERS_WINDOWS: "1"
  WORKERS_MACOS: "2"

jobs:
  # The only place that decides between the full and the reduced (integration) matrix.
  # Fail-safe: the matrix is reduced only for a pull request, for an explicit
  # `full_matrix: false` from a caller, or for a manual run of the integration profile that the
  # raise step below leaves there. An explicit true wins even when a caller came from a pull
  # request (in a called workflow, github.event_name is the caller's event). Only a dispatch
  # declares `profile` and only a call declares `full_matrix`, so each reads the other as null.
  # Both are compared as text because GitHub coerces a missing input (null) to equal false;
  # format() turns it into '' and keeps the default full. Jobs read the output, never
  # github.event_name -- workflow_contract.py holds both in place.
  plan:
    name: Plan the matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read # the checkout of the path filter and of the history the profile is measured on
    outputs:
      # The raise step can only turn the integration profile into full, never the other way.
      full_matrix: ${{ steps.raise.outputs.full_matrix == 'true' && 'true' || steps.decide.outputs.full_matrix }}
      desktop_csp_probe: ${{ steps.probe.outputs.desktop_csp_probe }}
      # The systems Core runs on: macOS only in the full profile (T-341 part B).
      native_macos: ${{ (steps.raise.outputs.full_matrix == 'true' || steps.decide.outputs.full_matrix == 'true') && 'true' || 'false' }}
      # One run_<group> per group of .github/test-paths.json. Full mode is true without asking
      # the filter; otherwise only a literal 'false' from a finished filter switches a group off.
      run_checks: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_checks == 'false' && 'false' || 'true') }}
      run_python: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_python == 'false' && 'false' || 'true') }}
      run_rust: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_rust == 'false' && 'false' || 'true') }}
      run_client: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_client == 'false' && 'false' || 'true') }}
      run_browser: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_browser == 'false' && 'false' || 'true') }}
      run_lint: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_lint == 'false' && 'false' || 'true') }}
      run_oidc: ${{ steps.decide.outputs.full_matrix == 'true' && 'true' || (steps.filter.outputs.run_oidc == 'false' && 'false' || 'true') }}
    steps:
      - id: decide
        env:
          FULL_MATRIX: ${{ inputs.full_matrix == true || inputs.profile == 'full' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name != 'pull_request' && format('{0}', inputs.profile) == '' && format('{0}', inputs.full_matrix) != 'false') }}
        run: echo "full_matrix=$FULL_MATRIX" >> "$GITHUB_OUTPUT"

      # The path filter reads paths only on a pull request in reduced mode. It needs the git
      # history two commits deep -- the merge commit GitHub builds for the pull request and its
      # parents -- and no file of the pull request: the working tree holds VERSION only. See
      # "Path filter" in docs/quality/ci.md. A manual run of the integration profile needs every
      # branch and commit instead, without old file contents (filter blob:none); git fetches the
      # few blobs the raise step reads on demand. See "Profiles" there.
      - name: Check out the path filter
        if: steps.decide.outputs.full_matrix != 'true' && (github.event_name == 'pull_request' || inputs.profile == 'integration')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          filter: ${{ github.event_name != 'pull_request' && 'blob:none' || '' }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            VERSION
      - name: Set up Python for the path filter
        if: steps.decide.outputs.full_matrix != 'true' && (github.event_name == 'pull_request' || inputs.profile == 'integration')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      # The filter and its rules come from the base (HEAD^1), never from the pull request, so a
      # pull request that changes them is judged by the rules it replaces. A base without them
      # (the pull request that introduces the filter) writes nothing: every run_<group> is true.
      - id: filter
        name: Select job groups by changed path
        if: steps.decide.outputs.full_matrix != 'true' && github.event_name == 'pull_request'
        run: |
          base="$RUNNER_TEMP/path-filter-base"
          mkdir -p "$base/.github" "$base/distribution/tooling"
          if git show HEAD^1:.github/test-paths.json > "$base/.github/test-paths.json" &&
            git show HEAD^1:distribution/tooling/path_filter.py > "$base/distribution/tooling/path_filter.py"; then
            # A crashed filter must never mean fewer tests: it runs every group. The step
            # itself stays green; later lines of $GITHUB_OUTPUT win over earlier ones.
            python "$base/distribution/tooling/path_filter.py" plan --repository . --merge HEAD --output "$GITHUB_OUTPUT" || {
              echo "::warning::the path filter failed, running everything"
              for group in checks python rust client browser lint oidc; do
                echo "run_$group=true" >> "$GITHUB_OUTPUT"
              done
            }
          else
            echo "::warning::the base has no readable path filter, running everything"
          fi

      # T-341 part B: a manual run of the integration profile becomes full when it changes native
      # code (.github/test-paths.json, group native) since its base -- the nearest fork point
      # from integration_bases. The head's copy only names that base; the base's own copy then
      # chooses again by its own rules and decides, so a run cannot narrow the rules it is judged
      # by. Full is written first and the decision after it; a later line wins, so anything that
      # fails on the way -- no base, a base before T-341 part B, a crash -- leaves the run full.
      - id: raise
        name: Raise the profile on a native change
        if: steps.decide.outputs.full_matrix != 'true' && github.event_name == 'workflow_dispatch' && inputs.profile == 'integration'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "full_matrix=true" >> "$GITHUB_OUTPUT"
          head="$RUNNER_TEMP/profile-head"
          base="$RUNNER_TEMP/profile-base"
          mkdir -p "$head/.github" "$head/distribution/tooling" "$base/.github" "$base/distribution/tooling"
          if git show HEAD:.github/test-paths.json > "$head/.github/test-paths.json" &&
            git show HEAD:distribution/tooling/path_filter.py > "$head/distribution/tooling/path_filter.py" &&
            commit=$(python "$head/distribution/tooling/path_filter.py" base --repository . --head HEAD --branch "$BRANCH") &&
            git show "$commit:.github/test-paths.json" > "$base/.github/test-paths.json" &&
            git show "$commit:distribution/tooling/path_filter.py" > "$base/distribution/tooling/path_filter.py"; then
            python "$base/distribution/tooling/path_filter.py" profile --repository . --head HEAD --branch "$BRANCH" --expect-base "$commit" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" ||
              echo "::warning::the base's profile rules failed, running the full matrix"
          else
            echo "::warning::no integration base with readable profile rules, running the full matrix"
            echo "- Profile raised to full: no integration base with readable profile rules" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only a workflow_dispatch declares the input; a call or a pull request reads it as
      # null, which is not true. Never beside the full matrix: that already holds the five
      # macOS jobs the plan allows, so it runs only in the integration profile, and only when
      # the raise step left it there.
      - id: probe
        env:
          DESKTOP_CSP_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_csp_probe == true && inputs.profile == 'integration' && steps.raise.outputs.full_matrix == 'false' }}
        run: echo "desktop_csp_probe=$DESKTOP_CSP_PROBE" >> "$GITHUB_OUTPUT"

  backend:
    needs: plan
    if: needs.plan.outputs.run_python == 'true'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10" # last 3.12 patch with setup-python builds for all three systems

      # Install the declared core dependencies. OIDC signature verification is
      # a supported web/desktop path and must never be skipped accidentally.
      - name: Install declared Python dependencies
        run: python -m pip install --quiet -e .

      - name: Backend suite
        run: python -m unittest discover -s tests/python -t tests/python -v

      - name: Distribution and version contracts
        run: python distribution/tooling/profile_contract.py check-release

      - name: Cross-runtime contract registry
        run: node tools/quality/check_contracts.mjs

      - name: CLI host with declared dependencies
        run: python -m unittest discover -s tests/python -t tests/python -p "test_cli_*.py" -v

  portable-core:
    needs: plan
    if: needs.plan.outputs.run_rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - run: cargo --locked fmt --check
      - run: cargo --locked clippy --workspace --all-targets -- -D warnings
      - run: cargo --locked test --workspace --all-targets

      # cargo-deny reads the graph through `cargo metadata`, so it runs where the pinned Rust
      # toolchain already is. Same download rule as the lint binaries: pinned version and
      # SHA-256 from distribution/toolchains.json, then the command a developer runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"
      - name: Install the checksum-locked cargo-deny
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lint-bin"
          mkdir -p "$bin"
          url="$(jq -er '.lintTools["cargo-deny"].downloadUrl' distribution/toolchains.json)"
          sha256="$(jq -er '.lintTools["cargo-deny"].sha256' distribution/toolchains.json)"
          file="$RUNNER_TEMP/$(basename "$url")"
          curl --fail --silent --show-error --location --output "$file" "$url"
          echo "$sha256  $file" | sha256sum --check --strict
          tar -xzf "$file" -C "$bin" --strip-components=1 --wildcards "*/cargo-deny"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Rust advisories, licenses and sources
        run: npm run lint:cargo-deny

  frontend:
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - run: npm ci

      - name: Install the pinned Python formatter
        run: python -m pip install --quiet "ruff==0.16.4"

      - name: Install the pinned workflow linter
        run: >-
          python -m pip install --quiet --require-hashes --only-binary=:all:
          -r distribution/lint-tools.requirements.txt

      # pyright resolves typer, PyJWT and markdown-it-py through this interpreter;
      # without the project's dependencies every third-party import is unresolved. pystray,
      # Pillow and hatchling are optional packages that tray.py, make_icons.py and
      # hatch_build.py import for real, so they are installed too. pywebview is left out on
      # purpose: its imports carry a reportMissingImports suppression (docs/quality/linting.md).
      - name: Install the project for the type check
        run: python -m pip install --quiet -e . "pystray>=0.19" "Pillow>=10" "hatchling==1.31.0"

      # The whole local gate, not a list of its parts: every linter that `npm run check`
      # chains (formatting, zizmor, and whatever lint:* joins it later) runs here without
      # this file having to name it. The job has what check needs -- npm ci, Python with
      # ruff, zizmor and the project for pyright, Rust with rustfmt.
      - name: Check gates, formatting and linters
        run: npm run check

      - name: Unit tests
        if: needs.plan.outputs.run_client == 'true'
        run: npx vitest run

      # `npm run build` is the check:* gates followed by tsc -b and vite build. The gates ran a
      # few steps up inside `npm run check`, so this step runs only the tail of the build script.
      # workflow_contract.py compares it with package.json: a gate added to `build` but not to
      # `check`, or a changed tail, fails the contract instead of silently going unrun here.
      - name: Type-check and build
        if: needs.plan.outputs.run_client == 'true'
        run: npx tsc -b && npx vite build

      # dist/ is committed (the wheel and the Docker image serve it), so a
      # source change without a rebuild ships a stale client. Vite's hashed
      # filenames make that easy to miss in review and impossible to miss here.
      - name: dist/ matches the sources
        if: needs.plan.outputs.run_client == 'true'
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  # actionlint, hadolint, shellcheck and osv-scanner are standalone binaries, not npm or
  # PyPI packages.
  # Each is downloaded at the version distribution/toolchains.json pins and refused unless
  # its SHA-256 matches; the npm scripts then run the command a developer runs locally.
  # Locally they skip when not installed -- here a missing binary fails the job.
  workflow-docker-shell-lint:
    needs: plan
    if: needs.plan.outputs.run_lint == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"

      - name: Install the checksum-locked lint binaries
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lint-bin"
          mkdir -p "$bin"
          for tool in actionlint hadolint shellcheck osv-scanner; do
            url="$(jq -er ".lintTools[\"$tool\"].downloadUrl" distribution/toolchains.json)"
            sha256="$(jq -er ".lintTools[\"$tool\"].sha256" distribution/toolchains.json)"
            file="$RUNNER_TEMP/$(basename "$url")"
            curl --fail --silent --show-error --location --output "$file" "$url"
            echo "$sha256  $file" | sha256sum --check --strict
            case "$file" in
              *.tar.gz) tar -xzf "$file" -C "$bin" "$tool" ;;
              *.tar.xz) tar -xJf "$file" -C "$bin" --strip-components=1 --wildcards "*/$tool" ;;
              *) install -m 0755 "$file" "$bin/$tool" ;;
            esac
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Workflow lint
        run: npm run lint:actionlint

      - name: Dockerfile lint
        run: npm run lint:hadolint

      - name: Shell script lint
        run: npm run lint:shellcheck

      # Every lockfile against the OSV advisory database: package-lock.json, Cargo.lock and
      # the hash-locked Python release locks. Exceptions with reason and expiry live in
      # osv-scanner.toml.
      - name: Known vulnerabilities in dependencies
        run: npm run lint:osv

  # Product and design suites share six runners, so npm/Chromium setup is paid six times.
  # Every slot runs a part of both, cut by measured duration (test-shards.mjs in the dev tools,
  # and tests/playwright/durations.json): `--shard` cut by count, and since many product tests skip
  # themselves for a project, slot 1 ran 10.3 minutes of product tests and slot 2 4.2.
  # Slot 6 also runs the layout audit rules, about 9 s, which the assignment counts as offset.
  #
  # The browser jobs need only the plan, not frontend: they serve the committed dist/, take no
  # artifact and no output from frontend, and its result reaches the run through the browser-e2e
  # gate below. A red frontend still turns the run red; it no longer delays the browsers by 3.5 min.
  browser-e2e-shards:
    name: Browser E2E / slot ${{ matrix.slot }} of 6
    needs: plan
    if: needs.plan.outputs.run_browser == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      # T-338: runners on image 20261116.376.1 ran out of root disk ("Free space left: 0 MB")
      # six to seven minutes into the design shard, while 20261116.133.1 runners on the same SHA
      # stayed green. Drop preinstalled toolsets this job never uses before anything is installed.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /
      - run: npm ci
      # apt with a time limit and one mirror switch; red if both attempts fail.
      - name: Install Chromium
        run: bash tools/dev/playwright-linux.sh
      - name: Install the application
        run: python -m pip install --quiet -e .
      # Ubuntu 24.04 refuses unprivileged user namespaces to programs without an AppArmor profile
      # (kernel.apparmor_restrict_unprivileged_userns=1), so Chromium got no sandbox here and the
      # slot's PDF export ended in pdf.render_failed / sandbox_unavailable (run 43611856985).
      # D-210: lift the restriction on this throwaway runner so the suite exercises the export
      # WITH the sandbox that T-269 F makes mandatory. QUILTOR_PDF_SANDBOX=off stays out of CI on
      # purpose; operators get the narrower options in docs/operations/installation.md.
      - name: Allow user namespaces for Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start the application
        run: |
          # The structured log goes to a file the product suite reads: save-error-id.spec.ts
          # finds the error id the editor shows in it, and fails in CI without the file.
          export QUILTOR_LOG_FILE="$RUNNER_TEMP/quiltor-structured.log"
          echo "PLAYWRIGHT_SERVER_LOG=$QUILTOR_LOG_FILE" >> "$GITHUB_ENV"
          python apps/web/server.py 8010 --no-open > "$RUNNER_TEMP/quiltor-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/quiltor-server.pid"
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8010/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/quiltor-server.log"
          exit 1
      # The rules project needs only Chromium, which this job installed above. One slot is
      # enough: the run is deterministic.
      - name: Layout audit rule tests
        if: matrix.slot == 6
        run: npm run test:audit-rules -- --reporter=line
      # select lists both suites, assigns all six slots, refuses unless every test lands in
      # exactly one, and has Playwright confirm that this slot's lists select exactly its tests.
      # A failed selection fails the slot; nothing runs on a list that was not confirmed.
      - name: Run product and design shards
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          set +e
          lists="$RUNNER_TEMP/test-lists"
          node tools/dev/test-shards.mjs select --os linux --slots 6 --slot "$SLOT" --offset 6=9000 --out-dir "$lists"
          select_status=$?
          product_status=1
          design_status=1
          if [ "$select_status" -eq 0 ]; then
            echo "Product browser tests of slot $SLOT"
            PLAYWRIGHT_WORKERS="$WORKERS_LINUX_PRODUCT" PLAYWRIGHT_FULLY_PARALLEL=1 PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/reports/product.json \
              npx playwright test --test-list "$lists/product.txt" --output=test-results/product --reporter=line,json
            product_status=$?

            echo "Design browser tests of slot $SLOT"
            PLAYWRIGHT_WORKERS="$WORKERS_LINUX_DESIGN" PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/reports/design.json \
              npx playwright test --config playwright.design.config.ts \
              --test-list "$lists/design.txt" --output=test-results/design --reporter=line,json
            design_status=$?
          fi
          df -h . 2>&1

          if [ "$select_status" -ne 0 ] || [ "$product_status" -ne 0 ] || [ "$design_status" -ne 0 ]; then
            echo "::error::Browser slot failures: select=$select_status product=$product_status design=$design_status"
            exit 1
          fi
      # The JSON reports carry each test's duration; tools/dev/test-shards.mjs update turns the
      # reports of a run into tests/playwright/durations.json. Kept on success too, briefly.
      - name: Upload test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-durations-linux-slot-${{ matrix.slot }}-of-6
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/reports/*.json
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-e2e-slot-${{ matrix.slot }}-of-6-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/quiltor-server.log

  # The OIDC browser suite (T-58 P7b, D-103): tests/e2e-oidc/support/oidc_stack.py starts a fake
  # Keycloak and the real server against it, and the tests end sessions on purpose. Linux only;
  # its own group, so on a pull request only sign-in, session and autosave changes run it, and
  # the full matrix always does. The stack picks its own ports (8035/8036) and data directory.
  browser-e2e-oidc:
    name: Browser E2E / OIDC sessions
    needs: plan
    if: needs.plan.outputs.run_oidc == 'true'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - run: npm ci
      # apt with a time limit and one mirror switch; red if both attempts fail.
      - name: Install Chromium
        run: bash tools/dev/playwright-linux.sh
      - name: Install the application
        run: python -m pip install --quiet -e .
      - name: Run the OIDC browser suite
        run: npx playwright test --config playwright.oidc.config.ts --output=test-results/oidc --reporter=line
      - name: Upload OIDC browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-e2e-oidc-diagnostics
          if-no-files-found: ignore
          path: test-results/oidc/**

  # Keep this job ID stable: branch protection requires `browser-e2e`, while
  # the matrix above may grow or rebalance without changing the required check.
  #
  # It is also the gate over every job the path filter can switch off: a job must succeed,
  # and may be skipped only when the plan did not select it. Any other skip -- a failed need,
  # a broken condition -- and every failure or cancellation is red. A selection is written as
  # `!= 'false'`, so a missing plan output counts as selected and its skip fails here.
  browser-e2e:
    needs:
      - plan
      - backend
      - portable-core
      - frontend
      - workflow-docker-shell-lint
      - browser-e2e-shards
      - visual-baseline-reach
      - cross-platform-native
      - cross-platform-browser
      - cross-platform-smoke
      - browser-e2e-oidc
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    # The one verdict a caller may build on. A called workflow concludes success even when every
    # job inside it was skipped, so release.yml reads this output, not the call's conclusion. It
    # is written only after every check below passed; a red gate leaves it empty. Beside it (T-345)
    # stand the profile the run tested with, and the run and attempt that produced the verdict --
    # in a call those are the caller's, the same numbers release.yml writes into the manifest.
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      profile: ${{ steps.gate.outputs.profile }}
      run_id: ${{ steps.gate.outputs.run_id }}
      run_attempt: ${{ steps.gate.outputs.run_attempt }}
    steps:
      - name: Require every selected job
        id: gate
        env:
          FULL_MATRIX: ${{ needs.plan.outputs.full_matrix }}
          SOURCE_REVISION: ${{ github.sha }}
          TEST_RUN_ID: ${{ github.run_id }}
          TEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          PLAN_RESULT: ${{ needs.plan.result }}
          RESULT_BACKEND: ${{ needs['backend'].result }}
          SELECTED_BACKEND: ${{ needs.plan.outputs.run_python != 'false' }}
          RESULT_PORTABLE_CORE: ${{ needs['portable-core'].result }}
          SELECTED_PORTABLE_CORE: ${{ needs.plan.outputs.run_rust != 'false' }}
          RESULT_FRONTEND: ${{ needs['frontend'].result }}
          SELECTED_FRONTEND: ${{ needs.plan.outputs.run_checks != 'false' }}
          RESULT_WORKFLOW_DOCKER_SHELL_LINT: ${{ needs['workflow-docker-shell-lint'].result }}
          SELECTED_WORKFLOW_DOCKER_SHELL_LINT: ${{ needs.plan.outputs.run_lint != 'false' }}
          RESULT_BROWSER_E2E_SHARDS: ${{ needs['browser-e2e-shards'].result }}
          SELECTED_BROWSER_E2E_SHARDS: ${{ needs.plan.outputs.run_browser != 'false' }}
          RESULT_VISUAL_BASELINE_REACH: ${{ needs['visual-baseline-reach'].result }}
          SELECTED_VISUAL_BASELINE_REACH: ${{ needs.plan.outputs.run_browser != 'false' }}
          RESULT_CROSS_PLATFORM_NATIVE: ${{ needs['cross-platform-native'].result }}
          SELECTED_CROSS_PLATFORM_NATIVE: ${{ needs.plan.outputs.run_python != 'false' || needs.plan.outputs.run_rust != 'false' }}
          RESULT_CROSS_PLATFORM_BROWSER: ${{ needs['cross-platform-browser'].result }}
          SELECTED_CROSS_PLATFORM_BROWSER: ${{ needs.plan.outputs.full_matrix == 'true' && needs.plan.outputs.run_browser != 'false' }}
          RESULT_CROSS_PLATFORM_SMOKE: ${{ needs['cross-platform-smoke'].result }}
          SELECTED_CROSS_PLATFORM_SMOKE: ${{ needs.plan.outputs.full_matrix != 'true' && needs.plan.outputs.run_browser != 'false' }}
          RESULT_BROWSER_E2E_OIDC: ${{ needs['browser-e2e-oidc'].result }}
          SELECTED_BROWSER_E2E_OIDC: ${{ needs.plan.outputs.run_oidc != 'false' }}
        run: |
          status=0
          require() {
            if [ "$2" = "success" ]; then
              echo "$1: success"
            elif [ "$2" = "skipped" ] && [ "$3" = "false" ]; then
              echo "$1: skipped, not selected by the plan"
            else
              echo "::error::$1 is $2 although the plan selected=$3; only success, or a skip the plan chose, passes."
              status=1
            fi
          }
          require plan "$PLAN_RESULT" true
          require backend "$RESULT_BACKEND" "$SELECTED_BACKEND"
          require portable-core "$RESULT_PORTABLE_CORE" "$SELECTED_PORTABLE_CORE"
          require frontend "$RESULT_FRONTEND" "$SELECTED_FRONTEND"
          require workflow-docker-shell-lint "$RESULT_WORKFLOW_DOCKER_SHELL_LINT" "$SELECTED_WORKFLOW_DOCKER_SHELL_LINT"
          require browser-e2e-shards "$RESULT_BROWSER_E2E_SHARDS" "$SELECTED_BROWSER_E2E_SHARDS"
          require visual-baseline-reach "$RESULT_VISUAL_BASELINE_REACH" "$SELECTED_VISUAL_BASELINE_REACH"
          require cross-platform-native "$RESULT_CROSS_PLATFORM_NATIVE" "$SELECTED_CROSS_PLATFORM_NATIVE"
          require cross-platform-browser "$RESULT_CROSS_PLATFORM_BROWSER" "$SELECTED_CROSS_PLATFORM_BROWSER"
          require cross-platform-smoke "$RESULT_CROSS_PLATFORM_SMOKE" "$SELECTED_CROSS_PLATFORM_SMOKE"
          require browser-e2e-oidc "$RESULT_BROWSER_E2E_OIDC" "$SELECTED_BROWSER_E2E_OIDC"
          # Full mode only: every job is selected except the reduced-only smoke test, which must
          # not be. A selection that turns false in full mode would be a skip the release
          # inherits; the plan already prevents it, and this keeps it from passing if it did.
          full_mode() {
            if [ "$FULL_MATRIX" = "true" ] && [ "$2" != "$3" ]; then
              echo "::error::$1 has selected=$2 in full mode; the full matrix requires $3."
              status=1
            fi
          }
          full_mode backend "$SELECTED_BACKEND" true
          full_mode portable-core "$SELECTED_PORTABLE_CORE" true
          full_mode frontend "$SELECTED_FRONTEND" true
          full_mode workflow-docker-shell-lint "$SELECTED_WORKFLOW_DOCKER_SHELL_LINT" true
          full_mode browser-e2e-shards "$SELECTED_BROWSER_E2E_SHARDS" true
          full_mode visual-baseline-reach "$SELECTED_VISUAL_BASELINE_REACH" true
          full_mode cross-platform-native "$SELECTED_CROSS_PLATFORM_NATIVE" true
          full_mode cross-platform-browser "$SELECTED_CROSS_PLATFORM_BROWSER" true
          full_mode cross-platform-smoke "$SELECTED_CROSS_PLATFORM_SMOKE" false
          full_mode browser-e2e-oidc "$SELECTED_BROWSER_E2E_OIDC" true
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          if [ "$FULL_MATRIX" = "true" ]; then
            verdict=full-success
            profile=full
          else
            verdict=reduced-success
            profile=integration
          fi
          printf '{"schemaVersion":1,"verdict":"%s","profile":"%s","sourceRevision":"%s","runId":%s,"runAttempt":%s}\n' \
            "$verdict" "$profile" "$SOURCE_REVISION" "$TEST_RUN_ID" "$TEST_RUN_ATTEMPT" > verdict.json
          {
            echo "verdict=$verdict"
            echo "profile=$profile"
            echo "run_id=$TEST_RUN_ID"
            echo "run_attempt=$TEST_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
      # The same values as a file, so a later run can read them without this run's logs. An
      # artifact expires; the manifest carries the values themselves, not a pointer to this file.
      - name: Keep the verdict as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-verdict
          path: verdict.json
          if-no-files-found: error
          overwrite: true

  # When a platform has no baseline set, visual-baseline.spec.ts skips itself there -- and
  # the suite reports green while comparing not a single pixel. This check names the gap
  # instead of letting it disappear behind a "skipped". It deliberately does not live in the
  # build script: otherwise nobody could build locally before every platform has its images.
  visual-baseline-reach:
    needs: plan
    if: needs.plan.outputs.run_browser == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false # runs a script out of tools/, never npm ci
          node-version: "22.23.2"
      - name: Every comparing platform has images
        run: node tools/quality/check_visual_baseline_reach.mjs

  # Linux runs above, sharded and as the required check. These jobs add macOS and Windows:
  # the same suites, so a failure that only happens there becomes visible here instead of
  # landing during a release build.
  cross-platform-native:
    name: Core on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.run_python == 'true' || needs.plan.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
        # The integration profile leaves macOS out (T-341 part B); 'none' excludes nothing.
        exclude:
          - os: ${{ needs.plan.outputs.native_macos == 'true' && 'none' || 'macos-15' }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      # The components belong to the action, not to rustup. Without them the first `cargo`
      # call installs the toolchain, then reads rust-toolchain.toml and adds clippy after the
      # fact -- on macos-15 that collides with the bin/cargo-clippy the runner image already
      # ships, and the job dies before the first test. Ubuntu has always done it this way.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Install declared Python dependencies
        run: python -m pip install --quiet -e .

      # Path separators, file locks and text encoding are where the three operating systems
      # really differ -- and this application writes files.
      - name: Backend suite
        run: python -m unittest discover -s tests/python -t tests/python

      # Formatting and clippy are platform independent and run once, on Linux.
      - name: Portable core
        run: cargo --locked test --workspace --all-targets

  # The full Windows and macOS matrix: the complete product and design suites on both systems.
  # Each slot runs one product and one design shard on the same runner, so the packages, Chromium
  # and the Windows media feature are set up once per slot instead of once per suite.
  #
  # Both suites are cut by measured duration, as on Linux (tools/dev/test-shards.mjs). The unit
  # tests run once per system, in slot 1, which the assignment counts as offset: 3.1 minutes on
  # Windows and 2.5 on macOS, measured in the run on 15e0b43.
  #
  # Windows runs nine slots and at most 100 product tests per slot (eight slots hold at most 800 tests, and
  # the suite reached 803 with T-220's drag spec): Chromium exhausted the
  # runner's network buffers after more than 115 product tests even with serialized browser
  # contexts. macOS runs four slots, the most the free plan's five concurrent macOS jobs allow next to
  # Core on macos-15 (T-160); with two its first slot took 13.5 minutes, with three 9 to 10.7.
  cross-platform-browser:
    name: Browser on ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.full_matrix == 'true' && needs.plan.outputs.run_browser == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            system: macos
            label: macos-15 / slot 1 of 4
            slot: 1
            slots: 4
            diagnostics: macos-15-1-of-4
          - os: macos-15
            system: macos
            label: macos-15 / slot 2 of 4
            slot: 2
            slots: 4
            diagnostics: macos-15-2-of-4
          - os: macos-15
            system: macos
            label: macos-15 / slot 3 of 4
            slot: 3
            slots: 4
            diagnostics: macos-15-3-of-4
          - os: macos-15
            system: macos
            label: macos-15 / slot 4 of 4
            slot: 4
            slots: 4
            diagnostics: macos-15-4-of-4
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 1 of 10
            slot: 1
            slots: 10
            diagnostics: windows-2025-1-of-10
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 2 of 10
            slot: 2
            slots: 10
            diagnostics: windows-2025-2-of-10
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 3 of 10
            slot: 3
            slots: 10
            diagnostics: windows-2025-3-of-10
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 4 of 10
            slot: 4
            slots: 10
            diagnostics: windows-2025-4-of-10
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 5 of 10
            slot: 5
            slots: 10
            diagnostics: windows-2025-5-of-10
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 6 of 10
            slot: 6
            slots: 10
            diagnostics: windows-2025-6-of-10
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 7 of 10
            slot: 7
            slots: 10
            diagnostics: windows-2025-7-of-10
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 8 of 10
            slot: 8
            slots: 10
            diagnostics: windows-2025-8-of-10
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 9 of 10
            slot: 9
            slots: 10
            diagnostics: windows-2025-9-of-10
          - os: windows-2025
            system: windows
            label: windows-2025 / slot 10 of 10
            slot: 10
            slots: 10
            diagnostics: windows-2025-10-of-10
    env:
      PYTHONPATH: src
    steps:
      # Windows hands out ephemeral TCP ports from 49152-65535 only (16384 ports, the default since
      # Vista; Microsoft KB 929851). A browser slot opens enough short-lived connections to the
      # server that the runner ran out of socket buffers (F2, WSAENOBUFS, docs/quality/ci.md).
      # 10000 + 55535 ends at 65534, the largest range Windows accepts. Fails the job when refused.
      - name: Widen the dynamic TCP port range
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          netsh int ipv4 show dynamicport tcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - run: npm ci

      - name: Install Chromium
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium

      # Windows installs the browser only: --with-deps enabled Media Foundation on every run
      # (144-225 s per job) and the suites pass without it (T-45, docs/quality/ci.md).
      - name: Install Chromium (Windows, browser only)
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Check that Chromium starts
        if: runner.os == 'Windows'
        run: node tools/dev/chromium-starts.mjs

      - name: Unit tests
        if: matrix.slot == 1
        run: npx vitest run

      - name: Install the application
        run: python -m pip install --quiet -e .

      - name: Start the application
        shell: bash
        run: |
          # The structured log goes to a file the product suite reads: save-error-id.spec.ts
          # finds the error id the editor shows in it, and fails in CI without the file.
          export QUILTOR_LOG_FILE="$RUNNER_TEMP/quiltor-structured.log"
          echo "PLAYWRIGHT_SERVER_LOG=$QUILTOR_LOG_FILE" >> "$GITHUB_ENV"
          python apps/web/server.py 8010 --no-open > "$RUNNER_TEMP/quiltor-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8010/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/quiltor-server.log"
          exit 1

      # Both suites run even when the first fails; the step fails if either did.
      # visual-baseline.spec.ts is part of the product suite and compares this system's images.
      # Windows keeps one worker per suite: Chromium failed with ERR_NO_BUFFER_SPACE there.
      - name: Run product and design shards
        env:
          PLAYWRIGHT_WORKERS: ${{ matrix.os == 'windows-2025' && env.WORKERS_WINDOWS || env.WORKERS_MACOS }}
          SYSTEM: ${{ matrix.system }}
          SLOT: ${{ matrix.slot }}
          SLOTS: ${{ matrix.slots }}
        shell: bash
        run: |
          set +e
          lists="$RUNNER_TEMP/test-lists"
          if [ "$SYSTEM" = windows ]; then
            shape=(--max-tests 100 --offset "1=186000")
          else
            shape=(--offset "1=150000")
          fi
          node tools/dev/test-shards.mjs select --os "$SYSTEM" --slots "$SLOTS" --slot "$SLOT" "${shape[@]}" --out-dir "$lists"
          select_status=$?
          product_status=1
          design_status=1
          if [ "$select_status" -eq 0 ]; then
            echo "Product browser tests of slot $SLOT"
            PLAYWRIGHT_FULLY_PARALLEL=1 PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/reports/product.json \
              npx playwright test --test-list "$lists/product.txt" --output=test-results/product --reporter=line,json
            product_status=$?

            echo "Design browser tests of slot $SLOT"
            PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/reports/design.json \
              npx playwright test --config playwright.design.config.ts \
              --test-list "$lists/design.txt" --output=test-results/design --reporter=line,json
            design_status=$?
          fi
          df -h . 2>&1

          if [ "$select_status" -ne 0 ] || [ "$product_status" -ne 0 ] || [ "$design_status" -ne 0 ]; then
            echo "::error::Browser slot failures: select=$select_status product=$product_status design=$design_status"
            exit 1
          fi

      - name: Upload test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-durations-${{ matrix.diagnostics }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/reports/*.json

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-platform-browser-${{ matrix.diagnostics }}-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/quiltor-server.log

  # The reduced matrix's stand-in for the job above: in the integration profile, Windows runs the unit tests and the product specs where the systems differ most -- the pixel
  # comparison against this system's baselines, opening a world and a chapter, and manuscript
  # import and export, which read and write files. About 50 of the 531 product tests, well under
  # the count where Windows ran out of network buffers. A Windows- or macOS-only failure in the
  # rest of the suites shows up on main, which always runs the full matrix.
  cross-platform-smoke:
    name: Smoke on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.full_matrix != 'true' && needs.plan.outputs.run_browser == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The integration profile runs no macOS job (T-341 part B).
        os: [windows-2025]
    env:
      PYTHONPATH: src
    steps:
      # Windows hands out ephemeral TCP ports from 49152-65535 only (16384 ports, the default since
      # Vista; Microsoft KB 929851). A browser slot opens enough short-lived connections to the
      # server that the runner ran out of socket buffers (F2, WSAENOBUFS, docs/quality/ci.md).
      # 10000 + 55535 ends at 65534, the largest range Windows accepts. Fails the job when refused.
      - name: Widen the dynamic TCP port range
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          netsh int ipv4 show dynamicport tcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - run: npm ci

      - name: Install Chromium
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium

      # Windows installs the browser only: --with-deps enabled Media Foundation on every run
      # (144-225 s per job) and the suites pass without it (T-45, docs/quality/ci.md).
      - name: Install Chromium (Windows, browser only)
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Check that Chromium starts
        if: runner.os == 'Windows'
        run: node tools/dev/chromium-starts.mjs

      - name: Unit tests
        run: npx vitest run

      - name: Install the application
        run: python -m pip install --quiet -e .

      - name: Start the application
        shell: bash
        run: |
          # The structured log goes to a file the product suite reads: save-error-id.spec.ts
          # finds the error id the editor shows in it, and fails in CI without the file.
          export QUILTOR_LOG_FILE="$RUNNER_TEMP/quiltor-structured.log"
          echo "PLAYWRIGHT_SERVER_LOG=$QUILTOR_LOG_FILE" >> "$GITHUB_ENV"
          python apps/web/server.py 8010 --no-open > "$RUNNER_TEMP/quiltor-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8010/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/quiltor-server.log"
          exit 1

      - name: Product smoke specs
        env:
          PLAYWRIGHT_WORKERS: ${{ matrix.os == 'windows-2025' && env.WORKERS_WINDOWS || env.WORKERS_MACOS }}
        shell: bash
        run: >-
          npx playwright test
          tests/e2e/visual-baseline.spec.ts
          tests/e2e/world-gate-responsive.spec.ts
          tests/e2e/chapter-navigation.spec.ts
          tests/e2e/manuscript-import.spec.ts
          tests/e2e/manuscript-export.spec.ts
          tests/e2e/editor-session-state.spec.ts
          tests/e2e/chapter-version-diff.spec.ts
          --output=test-results/product --reporter=line

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-platform-smoke-${{ matrix.os }}-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/**
            ${{ runner.temp }}/quiltor-server.log

  # T-272 (D-198): does the desktop window still save, export and sign in when its page policy
  # is enforced? WKWebView is the open question; Windows passed by hand. The probe opens the
  # real pywebview window, so this needs a runner with a graphical session -- macos-15 has one,
  # release.yml starts the built app there too. No secrets, read-only, not part of the verdict.
  desktop-csp-probe:
    name: Desktop CSP probe on macos-15
    needs: plan
    if: needs.plan.outputs.desktop_csp_probe == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      # The desktop app's own lock, hash-bound: pywebview and pyobjc as the release ships them.
      # Not --only-binary: proxy-tools is published as a source distribution only.
      - name: Install the desktop dependencies
        run: python -m pip install --require-hashes -r distribution/desktop/macos/direct/requirements.lock

      - name: Open the window under enforce and report-only
        env:
          PYTHONPATH: src
        run: |
          status=0
          python tools/dev/desktop_csp_probe.py --mode enforce --report desktop-csp-enforce.json || status=1
          python tools/dev/desktop_csp_probe.py --mode report-only --report desktop-csp-report-only.json || status=1
          exit "$status"

      # The probe redacts the token and the machine's directories and withholds a report that
      # still names one; this checks the files that would be uploaded once more.
      - name: Check the reports name no local path and no token
        if: always()
        run: |
          shopt -s nullglob
          reports=(desktop-csp-*.json)
          [ "${#reports[@]}" -gt 0 ] || exit 0
          if grep -nE "$HOME|$RUNNER_TEMP|/Users/|/var/folders/|token=[^<]" "${reports[@]}"; then
            echo "::error::a probe report names a local path or a token; not uploaded"
            rm -f "${reports[@]}"
            exit 1
          fi

      - name: Upload the probe reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-csp-probe-macos-15
          if-no-files-found: warn
          retention-days: 5
          path: desktop-csp-*.json

  # The llama-server conformance, on request only (T-179, D-167). It is not a required check:
  # browser-e2e does not need it, so a run that does not ask for it skips it on purpose and the
  # gate never sees it. Its verdict is the called workflow's own. The called file grants
  # contents: read; this job grants nothing beyond that.
  llama-conformance:
    if: inputs.llama_conformance == true
    permissions:
      contents: read
    uses: ./.github/workflows/llama-conformance.yml
    with:
      spike: ${{ inputs.llama_spike == true }}
