# Release-stage proxy (T-364): a plain nginx in front of Quiltor, as on a home server. Only
# what the checks depend on is set: compression and the usual forwarding headers. Timeouts
# and body limits stay at nginx's defaults on purpose -- a default that breaks an export is
# a finding, not something to tune away.
server {
	listen 80;
	server_name _;

	# 64m is what the home proxy (NPM) sets for its production host in the infra repo
	# (deploy/npm/bananenban.conf). No Quiltor-specific value exists there: an assumption.
	client_max_body_size 64m;

	gzip on;
	gzip_types application/json text/css application/javascript;
	gzip_proxied any;

	location / {
		proxy_pass http://t364-app:8000;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
